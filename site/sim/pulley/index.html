<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>실로 연결된 물체의 운동</title>
<style>
:root{ --bg:#f4f6f9; --panel:#fff; --ink:#1d2330; --sub:#5b6475; --line:#d9dde4; --accent:#2f6fdf; }
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.back{display:none;color:var(--accent);text-decoration:none;font-size:15px;padding:6px 0}
h1{font-size:22px;margin:4px 0}
.hint{color:var(--sub);font-size:14px;margin:0 0 12px;line-height:1.5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{flex:1 1 0;min-width:72px;font:inherit;font-size:14px;padding:10px 2px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
canvas{display:block;width:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:8px;margin-top:10px}
.stat{background:var(--bg);border-radius:8px;padding:8px;text-align:center}
.stat .k{font-size:12px;color:var(--sub)}
.stat .val{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.sl .top{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;gap:8px}
.sl .top b{font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
.sl input[type=range]{width:100%;margin:10px 0 2px;accent-color:var(--accent);height:28px}
.sl .range{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.sl select{width:100%;margin-top:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
select{max-width:100%;text-overflow:ellipsis}
button.b,select{font:inherit;font-size:15px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;touch-action:manipulation}
button.b.on,button.b.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
label.chk{display:flex;align-items:center;gap:6px;font-size:15px;cursor:pointer}
label.chk input{width:18px;height:18px}
.hide{display:none!important}
.note{font-size:13px;color:var(--sub);margin:8px 0 0;line-height:1.55}
@media (max-width:640px){ .controls{grid-template-columns:1fr} h1{font-size:19px} }

</style>
</head>
<body>
<div class="wrap">
  <a class="back" id="back" href="../../">← 목록으로</a>
<h1>실로 연결된 물체의 운동</h1>
  <p class="hint" id="hintTxt"></p>
  <div class="card">
    <div class="tabs" id="tabs">
      <button data-m="table">수평면</button>
      <button data-m="atwood">도르래 양쪽</button>
      <button data-m="incl">양쪽 빗면</button>
    </div>
    <canvas id="sim" style="height:320px;border-radius:8px;background:#fbfcfd"></canvas>
    <div class="row">
      <button class="b primary" id="goB">놓기</button><button class="b" id="resetB">처음으로</button>
      <button class="b m-table m-atwood" id="swapB">A와 B 바꾸기</button>
      <button class="b m-incl" id="cutB">A와 B 사이의 실 끊기</button>
      <button class="b m-incl" id="balB">일정한 속력이 되게 기울기 맞추기</button>
    </div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="card"><canvas id="graph" style="height:200px"></canvas></div>
  <div class="card">
    <div class="controls">
      <div class="sl"><div class="top"><span>A의 질량</span><b id="aV"></b></div>
        <input type="range" id="aS" min="0.5" max="5" step="0.5" value="1"><div class="range"><span>0.5 kg</span><span>5 kg</span></div></div>
      <div class="sl"><div class="top"><span>B의 질량</span><b id="bV"></b></div>
        <input type="range" id="bS" min="0.5" max="5" step="0.5" value="4"><div class="range"><span>0.5 kg</span><span>5 kg</span></div></div>
      <div class="sl m-incl"><div class="top"><span>C의 질량</span><b id="cV"></b></div>
        <input type="range" id="cS" min="0.5" max="5" step="0.5" value="2"><div class="range"><span>0.5 kg</span><span>5 kg</span></div></div>
      <div class="sl m-incl"><div class="top"><span>왼쪽 빗면의 기울기</span><b id="lV"></b></div>
        <input type="range" id="lS" min="15" max="60" step="1" value="30"><div class="range"><span>15°</span><span>60°</span></div></div>
      <div class="sl m-incl"><div class="top"><span>오른쪽 빗면의 기울기</span><b id="rV"></b></div>
        <input type="range" id="rS" min="15" max="60" step="0.1" value="48.6"><div class="range"><span>15°</span><span>60°</span></div></div>
      <div class="sl m-incl"><div class="top"><span>처음 속력 (C가 내려가는 방향)</span><b id="vV"></b></div>
        <input type="range" id="vS" min="0" max="2" step="0.1" value="0.8"><div class="range"><span>0 (정지)</span><span>2 m/s</span></div></div>
    </div>
    <p class="note" id="noteTxt"></p>
  </div>
</div>
<script>
(function(){
const $ = id => document.getElementById(id);
const FONT = '"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif';
const INK = '#1d2330', SUB = '#5b6475', GRAY = '#9aa3b2', WIRE = '#3a4252', BLUE = '#2f6fdf', RED = '#d64541', ORANGE = '#e0782f', GREEN = '#2e9e6a', PURPLE = '#8e44ad', YELLOW = '#e0a400';
if (/\/sim\//.test(location.pathname) && location.protocol.startsWith('http')) $('back').style.display = 'inline-block';
// 캔버스 크기 맞추기: {ctx, W, H}
function fitCanvas(c){ const d = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight; c.width = w * d; c.height = h * d; const x = c.getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0); return { ctx: x, W: w, H: h }; }
function T(ctx, s, x, y, o){ o = o || {}; ctx.fillStyle = o.color || SUB; ctx.font = (o.bold ? 'bold ' : '') + (o.size || 12) + 'px ' + FONT; ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle'; ctx.fillText(s, x, y); }
function line(ctx, pts, color, lw, dash){ ctx.strokeStyle = color || WIRE; ctx.lineWidth = lw || 2; ctx.setLineDash(dash ? (dash === true ? [5, 4] : dash) : []); ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); ctx.setLineDash([]); }
function arrow(ctx, x1, y1, x2, y2, color, lw, hs){
  const L = Math.hypot(x2 - x1, y2 - y1); if (L < 2) return; hs = hs || Math.min(10, 4 + L * 0.3); const ux = (x2 - x1) / L, uy = (y2 - y1) / L;
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw || 2.5; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - ux * hs * 0.8, y2 - uy * hs * 0.8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - ux * hs - uy * hs * 0.55, y2 - uy * hs + ux * hs * 0.55); ctx.lineTo(x2 - ux * hs + uy * hs * 0.55, y2 - uy * hs - ux * hs * 0.55); ctx.closePath(); ctx.fill(); }
function setStats(items){ $('stats').innerHTML = items.map(([k, v, c]) => `<div class="stat"><div class="k">${k}</div><div class="val"${c ? ` style="color:${c}"` : ''}>${v}</div></div>`).join(''); }
const fmt = (v, d) => { const s = (+v).toFixed(d); return (+s === 0 ? (0).toFixed(d) : s).replace('-', '−'); };
// 슬라이더 값 표시: {슬라이더id: [표시id, 값 => 문자열]}
function bindLabels(map){ const up = () => { for (const k in map){ const [lid, f] = map[k]; $(lid).textContent = f(+$(k).value, $(k)); } }; for (const k in map) $(k).addEventListener('input', up); up(); return up; }
function niceMax(v){ v = Math.max(v, 1e-9); const p = Math.pow(10, Math.floor(Math.log10(v))); for (const k of [1, 2, 2.5, 5, 10]) if (k * p >= v * 0.999) return k * p; return 10 * p; }
// 탭: 버튼에 data-m, 요소에 class="m-이름"
function setupTabs(onChange){
  const btns = document.querySelectorAll('#tabs button');
  const go = m => { btns.forEach(b => b.classList.toggle('on', b.dataset.m === m));
    document.querySelectorAll('[class*="m-"]').forEach(e => { const cl = [...e.classList].filter(k => k.startsWith('m-')); if (cl.length) e.classList.toggle('hide', !cl.includes('m-' + m)); });
    onChange(m); };
  btns.forEach(b => b.addEventListener('click', () => go(b.dataset.m))); go(btns[0].dataset.m); return go; }
// 시간 그래프. panels: [{keys:[...], names:[...], colors:[...], min: 최소 범위, pos: true면 0부터 위로만}]
function timeGraph(ctx, W, H, buf, t, panels, win){
  win = win || 10; ctx.clearRect(0, 0, W, H);
  const ph = H / panels.length, L = 50, R = 36, pw = W - L - R, t1 = Math.max(t, win), t0 = t1 - win;
  panels.forEach((p, k) => {
    const top = k * ph + 20, h = ph - 42; let mx = p.min || 1;
    for (const b of buf) if (b.t >= t0) for (const key of p.keys) mx = Math.max(mx, Math.abs(b[key]));
    const Y = p.fixed || niceMax(mx * 1.05), lo = p.pos ? 0 : -Y, yy = v => top + h - (v - lo) / (Y - lo) * h;
    ctx.font = 'bold 12px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; let lx = L;
    p.keys.forEach((key, i) => { ctx.fillStyle = p.colors[i]; ctx.fillText(p.names[i], lx, top - 3); lx += ctx.measureText(p.names[i]).width + 14; });
    ctx.strokeStyle = '#d9dde4'; ctx.lineWidth = 1; ctx.strokeRect(L, top, pw, h);
    ctx.strokeStyle = GRAY; ctx.beginPath(); ctx.moveTo(L, yy(0)); ctx.lineTo(L + pw, yy(0)); ctx.stroke();
    ctx.font = '11px ' + FONT; ctx.fillStyle = SUB; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    const lab = v => String(+v.toPrecision(3)).replace('-', '−');
    ctx.fillText(lab(Y), L - 4, top + 4); ctx.fillText('0', L - 4, yy(0)); if (!p.pos) ctx.fillText(lab(-Y), L - 4, top + h - 4);
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const st = win > 20 ? 5 : 1; for (let s = Math.ceil(t0 / st) * st; s <= t1 + 1e-9; s += st) ctx.fillText(String(s), L + (s - t0) / win * pw, top + h + 3);
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText('t (s)', W - 2, yy(0));
    ctx.save(); ctx.beginPath(); ctx.rect(L, top, pw, h); ctx.clip();
    p.keys.forEach((key, i) => { ctx.strokeStyle = p.colors[i]; ctx.lineWidth = 2.2; ctx.beginPath(); let s = false;
      for (const b of buf){ if (b.t < t0 || b[key] === undefined) continue; const X = L + (b.t - t0) / win * pw, Yp = yy(b[key]); s ? ctx.lineTo(X, Yp) : (ctx.moveTo(X, Yp), s = true); }
      ctx.stroke(); });
    ctx.restore(); });
}
// x–y 그래프 축. 반환: {X, Y} 변환 함수
function axes(ctx, W, H, o){
  const L = o.L || 52, R = o.R || 14, top = o.top || 14, B = o.B || 40, pw = W - L - R, h = H - top - B;
  const X = v => L + (v - o.x0) / (o.x1 - o.x0) * pw, Y = v => top + h - (v - o.y0) / (o.y1 - o.y0) * h;
  ctx.strokeStyle = '#d9dde4'; ctx.lineWidth = 1; ctx.strokeRect(L, top, pw, h);
  ctx.font = '11px ' + FONT; ctx.fillStyle = SUB;
  (o.xt || []).forEach(v => { ctx.strokeStyle = '#eef0f4'; ctx.beginPath(); ctx.moveTo(X(v), top); ctx.lineTo(X(v), top + h); ctx.stroke(); ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText(String(v), X(v), top + h + 3); });
  (o.yt || []).forEach(v => { ctx.strokeStyle = '#eef0f4'; ctx.beginPath(); ctx.moveTo(L, Y(v)); ctx.lineTo(L + pw, Y(v)); ctx.stroke(); ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText(String(v), L - 4, Y(v)); });
  if (o.xl){ ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText(o.xl, L + pw / 2, top + h + 18); }
  if (o.yl){ ctx.save(); ctx.translate(11, top + h / 2); ctx.rotate(-Math.PI / 2); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(o.yl, 0, 0); ctx.restore(); }
  return { X, Y, L, top, pw, h };
}
function loop(fn){ let last = performance.now(); const f = now => { const dt = Math.max(0, Math.min((now - last) / 1000, 0.05)); last = now; fn(dt, now / 1000); requestAnimationFrame(f); }; requestAnimationFrame(f); }
function pointer(c, down, move, up){
  const loc = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }; let active = false;
  c.addEventListener('pointerdown', e => { const [x, y] = loc(e); if (down(x, y) !== false){ active = true; c.setPointerCapture(e.pointerId); e.preventDefault(); } });
  c.addEventListener('pointermove', e => { if (active){ const [x, y] = loc(e); move && move(x, y); } });
  const end = () => { if (active){ active = false; up && up(); } }; c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
}
// 소리 (Web Audio)
let _ac = null;
function audio(){ if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)(); if (_ac.state === 'suspended') _ac.resume(); return _ac; }
function tone(){ const ac = audio(), o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0; o.connect(g).connect(ac.destination); o.start();
  return { set(f, v){ o.frequency.setTargetAtTime(f, ac.currentTime, 0.02); g.gain.setTargetAtTime(v, ac.currentTime, 0.03); }, stop(){ g.gain.setTargetAtTime(0, ac.currentTime, 0.03); setTimeout(() => o.stop(), 200); } }; }
// 파장(nm) → [r,g,b] (0~1)
function lamRGB(l){ let r = 0, g = 0, b = 0;
  if (l < 440){ r = -(l - 440) / 60; b = 1; } else if (l < 490){ g = (l - 440) / 50; b = 1; } else if (l < 510){ g = 1; b = -(l - 510) / 20; }
  else if (l < 580){ r = (l - 510) / 70; g = 1; } else if (l < 645){ r = 1; g = -(l - 645) / 65; } else r = 1;
  const f = l < 380 || l > 750 ? 0 : l < 420 ? 0.3 + 0.7 * (l - 380) / 40 : l > 680 ? 0.3 + 0.7 * (750 - l) / 70 : 1; return [Math.max(0, r) * f, Math.max(0, g) * f, Math.max(0, b) * f]; }
const rgbCss = (c, k = 1, a = 1) => `rgba(${Math.round(255 * Math.min(1, c[0] * k))},${Math.round(255 * Math.min(1, c[1] * k))},${Math.round(255 * Math.min(1, c[2] * k))},${a})`;

const S = $('sim'), G = $('graph'); let s, gr; const rs = () => { s = fitCanvas(S); gr = fitCanvas(G); }; window.addEventListener('resize', rs);
const g = 9.8, D = Math.PI / 180, BS = 24;
let mode, t = 0, run = false, done = '', x = 0, v = 0, cut = false, xA = 0, vA = 0, buf = [], cutX = 0, topC = null;
bindLabels({ aS: ['aV', v => v.toFixed(1) + ' kg'], bS: ['bV', v => v.toFixed(1) + ' kg'], cS: ['cV', v => v.toFixed(1) + ' kg'], lS: ['lV', v => v + '°'], rS: ['rV', v => (+v).toFixed(1) + '°'], vS: ['vV', v => v.toFixed(1) + ' m/s'] });
// 실의 방향(+: 오른쪽 물체가 내려가는 방향)으로 본 물체 목록. k: 중력 가운데 운동 방향 성분의 비율
function objs(){
  const mA = +$('aS').value, mB = +$('bS').value, mC = +$('cS').value;
  if (mode === 'table') return [{ n: 'A', m: mA, k: 0, c: BLUE }, { n: 'B', m: mB, k: 1, c: ORANGE }];
  if (mode === 'atwood') return [{ n: 'A', m: mA, k: -1, c: BLUE }, { n: 'B', m: mB, k: 1, c: ORANGE }];
  const k1 = -Math.sin(+$('lS').value * D), k2 = Math.sin(+$('rS').value * D);
  return [{ n: 'A', m: mA, k: k1, c: BLUE }, { n: 'B', m: mB, k: k1, c: ORANGE }, { n: 'C', m: mC, k: k2, c: GREEN }];
}
function accel(list){ let F = 0, M = 0; list.forEach(o => { F += o.m * g * o.k; M += o.m; }); return F / M; }
// 물체 사이의 실이 당기는 힘: 앞쪽 물체들만 묶어서 구한다
function tensions(list, a){ const T = []; let sum = 0; for (let i = 0; i < list.length - 1; i++){ sum += list[i].m * a - list[i].m * g * list[i].k; T.push(sum); } return T; }
function reset(){ t = 0; run = false; done = ''; x = 0; xA = 0; cut = false; buf = []; cutX = 0; topC = null; v = vA = mode === 'incl' ? +$('vS').value : 0; $('goB').textContent = mode === 'incl' && v > 0 ? '출발' : '놓기'; $('cutB').disabled = false; }
function geoIncl(){
  const { W, H } = s, a1 = +$('lS').value * D, a2 = +$('rS').value * D, ax = W / 2, ay = 62, by = H - 26;
  const L1 = Math.min((W / 2 - 12) / Math.cos(a1), (by - ay) / Math.sin(a1)), L2 = Math.min((W / 2 - 12) / Math.cos(a2), (by - ay) / Math.sin(a2));
  const ppm = 88; return { a1, a2, ax, ay, by, L1, L2, ppm, len1: L1 / ppm, len2: L2 / ppm };
}
function step(dt){
  if (!run || done) return;
  const o = objs(), n = 4, h = dt / n;
  for (let i = 0; i < n; i++){
    if (cut){ const aA = g * o[0].k, a = accel(o.slice(1)); vA += aA * h; xA += vA * h; v += a * h; x += v * h;
      if (topC === null && vA <= 0) topC = x - cutX; }
    else { const a = accel(o); v += a * h; x += v * h; xA = x; vA = v; }
    t += h;
    if (mode === 'table'){ if (x >= 0.8){ done = 'A가 L만큼 이동했습니다.'; break; } }
    else if (mode === 'atwood'){ if (Math.abs(x) >= 0.6){ done = '끝까지 이동했습니다.'; break; } }
    else { const q = geoIncl(), dA = 1.5 - xA, dB = 1.1 - x, dC = 0.45 + x;
      if (dB < 0.22 || dC < 0.22 || dC > q.len2 - 0.16 || dB > q.len1 - 0.16 || dA > q.len1 - 0.16 || (cut ? dA - dB < 0.3 && vA > v : false) || dA < 0.22){ done = '물체가 빗면의 끝에 닿아 멈췄습니다.'; break; } }
  }
  buf.push({ t, v, vA }); if (buf.length > 900) buf.shift();
  if (done){ run = false; $('goB').textContent = '놓기'; }
}
function box(ctx, cx, cy, ang, o){ ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang); ctx.fillStyle = o.c; ctx.fillRect(-BS / 2, -BS / 2, BS, BS); ctx.restore(); T(ctx, o.n, cx, cy, { color: '#fff', bold: true, size: 13 }); }
function ghost(ctx, cx, cy, ang){ ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang); ctx.strokeStyle = GRAY; ctx.setLineDash([3, 3]); ctx.strokeRect(-BS / 2, -BS / 2, BS, BS); ctx.setLineDash([]); ctx.restore(); }
function pulley(ctx, x, y, r){ ctx.fillStyle = '#fff'; ctx.strokeStyle = WIRE; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.stroke(); ctx.fillStyle = WIRE; ctx.beginPath(); ctx.arc(x, y, 2.5, 0, 7); ctx.fill(); }
function draw(dt){
  step(dt);
  const { ctx, W, H } = s, o = objs(); ctx.clearRect(0, 0, W, H);
  if (mode === 'table'){
    const ty = 120, px = W - 70, ppm = Math.min((W - 150) / 0.8, 170), x0 = px - 34 - 0.8 * ppm, by0 = ty + 36;
    ctx.fillStyle = '#e6e9f0'; ctx.fillRect(10, ty, px - 10, 12); line(ctx, [[10, ty], [px, ty]], WIRE, 2); line(ctx, [[px, ty], [px, H - 20]], WIRE, 2);
    const ax = x0 + x * ppm, bx = px + 18, byy = by0 + x * ppm;
    ghost(ctx, x0, ty - BS / 2, 0); ghost(ctx, bx, by0, 0);
    line(ctx, [[ax + BS / 2, ty - BS / 2], [px + 9, ty - BS / 2]], WIRE, 1.5); line(ctx, [[bx, ty - BS / 2 + 9], [bx, byy - BS / 2]], WIRE, 1.5);
    pulley(ctx, px + 9, ty - BS / 2 + 9, 9); box(ctx, ax, ty - BS / 2, 0, o[0]); box(ctx, bx, byy, 0, o[1]);
    line(ctx, [[x0, ty + 26], [x0 + 0.8 * ppm, ty + 26]], SUB, 1); line(ctx, [[x0, ty + 21], [x0, ty + 31]], SUB, 1); line(ctx, [[x0 + 0.8 * ppm, ty + 21], [x0 + 0.8 * ppm, ty + 31]], SUB, 1);
    T(ctx, 'L = 0.8 m', x0 + 0.4 * ppm, ty + 40, { size: 12 }); T(ctx, '수평면', 16, ty - 10, { align: 'left', size: 11 });
  } else if (mode === 'atwood'){
    const cx = W / 2, py = 52, r = 24, ppm = 150, y0 = 175;
    line(ctx, [[cx - 40, 14], [cx + 40, 14]], WIRE, 3); line(ctx, [[cx, 14], [cx, py]], WIRE, 2);
    const ya = y0 - x * ppm, yb = y0 + x * ppm;
    ghost(ctx, cx - r, y0, 0); ghost(ctx, cx + r, y0, 0);
    line(ctx, [[cx - r, py], [cx - r, ya - BS / 2]], WIRE, 1.5); line(ctx, [[cx + r, py], [cx + r, yb - BS / 2]], WIRE, 1.5);
    pulley(ctx, cx, py, r); box(ctx, cx - r, ya, 0, o[0]); box(ctx, cx + r, yb, 0, o[1]);
    line(ctx, [[20, H - 14], [W - 20, H - 14]], WIRE, 2);
  } else {
    const q = geoIncl(), P = q.ppm, hb = BS / 2 + 1;
    const dL = [-Math.cos(q.a1), Math.sin(q.a1)], nL = [-Math.sin(q.a1), -Math.cos(q.a1)], dR = [Math.cos(q.a2), Math.sin(q.a2)], nR = [Math.sin(q.a2), -Math.cos(q.a2)];
    ctx.fillStyle = '#e6e9f0'; ctx.beginPath(); ctx.moveTo(q.ax, q.ay); ctx.lineTo(q.ax + dL[0] * q.L1, q.ay + dL[1] * q.L1); ctx.lineTo(q.ax + dR[0] * q.L2, q.ay + dR[1] * q.L2); ctx.closePath(); ctx.fill();
    line(ctx, [[q.ax + dL[0] * q.L1, q.ay + dL[1] * q.L1], [q.ax, q.ay], [q.ax + dR[0] * q.L2, q.ay + dR[1] * q.L2]], WIRE, 2);
    const at = (d, n, dist) => [q.ax + d[0] * dist * P + n[0] * hb, q.ay + d[1] * dist * P + n[1] * hb];
    const pA = at(dL, nL, 1.5 - xA), pB = at(dL, nL, 1.1 - x), pC = at(dR, nR, 0.45 + x), tl = at(dL, nL, 0.05), tr = at(dR, nR, 0.05);
    ghost(ctx, ...at(dL, nL, 1.5), -q.a1); ghost(ctx, ...at(dL, nL, 1.1), -q.a1); ghost(ctx, ...at(dR, nR, 0.45), q.a2);
    if (!cut) line(ctx, [pA, pB], WIRE, 1.5); line(ctx, [pB, tl, tr, pC], WIRE, 1.5);
    pulley(ctx, q.ax, q.ay - hb + 1, 9); box(ctx, pA[0], pA[1], -q.a1, o[0]); box(ctx, pB[0], pB[1], -q.a1, o[1]); box(ctx, pC[0], pC[1], q.a2, o[2]);
    T(ctx, $('lS').value + '°', q.ax + dL[0] * q.L1 + 34, q.ay + dL[1] * q.L1 - 6, { size: 11 }); T(ctx, (+$('rS').value).toFixed(1) + '°', q.ax + dR[0] * q.L2 - 34, q.ay + dR[1] * q.L2 - 6, { size: 11 });
    if (cut) T(ctx, 'A와 B 사이의 실이 끊어짐', W / 2, 16, { color: RED, bold: true, size: 12 });
  }
  if (done) T(ctx, done, W / 2, mode === 'table' ? 24 : H - 4 - (mode === 'atwood' ? 16 : 0), { color: RED, bold: true, size: 12, base: mode === 'table' ? 'middle' : 'bottom' });
  // 값
  const f2 = (val, u) => fmt(val, 2) + ' ' + u;
  if (mode === 'incl'){
    const aAll = accel(o), aA = cut ? g * o[0].k : aAll, aR = cut ? accel(o.slice(1)) : aAll, Tn = cut ? [0].concat(tensions(o.slice(1), aR)) : tensions(o, aAll);
    setStats([['A의 가속도', f2(aA, 'm/s²'), BLUE], ['B, C의 가속도', f2(aR, 'm/s²'), GREEN], ['A–B 실이 당기는 힘', cut ? '끊어짐' : f2(Tn[0], 'N')], ['B–C 실이 당기는 힘', f2(Tn[1], 'N')],
      ['A의 속도', f2(vA, 'm/s'), BLUE], ['C의 속도', f2(v, 'm/s'), GREEN], ['실이 끊어진 뒤 C의 이동 거리', cut ? f2(x - cutX, 'm') : '—'], ['A가 최고점일 때 C의 이동 거리', topC === null ? '—' : f2(topC, 'm'), ORANGE]]);
  } else {
    const a = accel(o), Tn = tensions(o, a);
    setStats([['가속도의 크기', f2(Math.abs(a), 'm/s²'), ORANGE], ['실이 당기는 힘', f2(Tn[0], 'N')], ['속력', f2(Math.abs(v), 'm/s')], ['이동 거리', f2(Math.abs(x), 'm')], ['걸린 시간', f2(t, 's'), BLUE]]);
  }
  const names = cut ? ['B, C의 속도 (m/s)', 'A의 속도 (m/s)'] : [mode === 'incl' ? '속도 (m/s)  +: C가 내려가는 방향' : '속도 (m/s)'];
  timeGraph(gr.ctx, gr.W, gr.H, buf, t, [{ keys: cut ? ['v', 'vA'] : ['v'], names, colors: cut ? [GREEN, BLUE] : [ORANGE], min: 2, pos: mode === 'table' }], 3);
}
const TEXT = {
  table: ['수평면 위의 A와 매달린 B가 실로 연결되어 있습니다. ‘놓기’를 눌러 A가 L만큼 이동하는 데 걸리는 시간을 재고, ‘A와 B 바꾸기’를 눌러 비교하세요. 모든 마찰은 무시합니다.',
    '실로 연결된 두 물체는 가속도의 크기가 같으므로 한 덩어리로 보고 운동 방정식을 세울 수 있습니다. 두 물체를 움직이게 하는 힘은 매달린 물체에 작용하는 중력뿐이므로 가속도는 a = (매달린 물체의 질량 × g) ÷ (두 물체의 질량의 합)입니다. 정지 상태에서 출발해 L만큼 이동하는 데 걸리는 시간은 L = ½at²에서 t = √(2L/a)이므로, 가속도가 4배가 되면 걸리는 시간은 절반이 됩니다. 실이 당기는 힘은 수평면 위의 물체만 따로 보면 T = (그 물체의 질량) × a입니다.'],
  atwood: ['도르래 양쪽에 A와 B가 매달려 있습니다. 질량을 바꾸며 가속도와 실이 당기는 힘이 어떻게 달라지는지 확인하세요.',
    '무거운 쪽이 내려가고 가벼운 쪽이 올라갑니다. 두 물체를 한 덩어리로 보면 알짜힘은 두 물체에 작용하는 중력의 차이므로 a = (질량의 차 × g) ÷ (질량의 합)입니다. 실이 당기는 힘은 가벼운 물체의 무게보다 크고 무거운 물체의 무게보다 작습니다. 두 질량이 같으면 알짜힘이 0이어서 정지해 있거나 등속도 운동을 합니다.'],
  incl: ['양쪽 빗면 위의 A, B, C가 실로 연결되어 있습니다. 처음 속력을 주고 출발시킨 뒤 ‘A와 B 사이의 실 끊기’를 눌러, 끊어지기 전과 후의 가속도를 비교하세요. 모든 마찰은 무시합니다.',
    '빗면 위의 물체를 빗면 아래로 당기는 힘은 중력의 빗면 방향 성분(mg sinθ)입니다. 양쪽에서 이 힘의 크기가 같으면 알짜힘이 0이므로 세 물체는 일정한 속력으로 운동합니다. 실이 끊어지면 A는 중력의 빗면 방향 성분만 받아 속력이 줄다가 최고점에서 순간적으로 멈춘 뒤 내려오고, B와 C는 한 덩어리로 등가속도 운동을 합니다. 실이 당기는 힘은 물체 하나만 따로 떼어 운동 방정식을 세우면 구할 수 있습니다. 문제의 조건에 맞게 질량과 기울기를 바꾸고, ‘일정한 속력이 되게 기울기 맞추기’를 누르면 오른쪽 빗면의 기울기가 세 물체가 등속도 운동을 하는 값으로 맞춰집니다.'] };
