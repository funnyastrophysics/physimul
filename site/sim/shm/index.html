<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>단진동 시뮬레이션</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --ink:#1d2330; --sub:#5b6475; --line:#d9dde4;
    --accent:#2f6fdf; --xc:#2f6fdf; --vc:#e0782f; --ac:#2e9e6a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:1000px;margin:0 auto;padding:16px}
  h1{font-size:22px;margin:4px 0 4px}
  .hint{color:var(--sub);font-size:14px;margin:0 0 12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
  canvas{display:block;width:100%}
  #sim{height:230px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:10px}
  .stat{background:var(--bg);border-radius:8px;padding:8px;text-align:center}
  .stat .k{font-size:12px;color:var(--sub)}
  .stat .val{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
  .formula{font-size:13px;color:var(--sub);margin-top:8px;text-align:center}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .sl .top{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
  .sl .top b{font-variant-numeric:tabular-nums;color:var(--accent)}
  .sl input[type=range]{width:100%;margin:10px 0 2px;accent-color:var(--accent);height:28px}
  .sl .range{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
  button,select{font:inherit;font-size:15px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .checks{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;margin-bottom:8px}
  .checks label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .checks input{width:18px;height:18px}
  .empty{color:var(--sub);font-size:14px;text-align:center;padding:16px}
  @media (max-width:640px){ .controls{grid-template-columns:1fr} h1{font-size:19px} }
.tbar{margin-top:12px}
.tbar .top{display:flex;justify-content:space-between;align-items:center;font-size:15px;gap:8px;flex-wrap:wrap}
.tbar .tb-r{display:flex;align-items:center;gap:6px}
.tbar .tb-r button.b{padding:7px 10px;font-size:14px}
.tbar input[type=range]{width:100%;margin:10px 0 2px;accent-color:var(--accent);height:28px}
.tbar .range{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.stat.tcell{outline:1.5px solid var(--accent);background:#fff}
.stat.tcell .k::after{content:" (직접 입력)";color:var(--accent)}
.stat.tcell .val{display:flex;justify-content:center;align-items:baseline;gap:3px}
.stat.tcell input{font:inherit;font-weight:700;color:var(--ink);width:72px;padding:1px 2px;border:0;border-bottom:1.5px solid var(--accent);border-radius:0;background:transparent;text-align:right;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stat.tcell input::-webkit-outer-spin-button,.stat.tcell input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stat.tcell i{font-style:normal;font-weight:700}
.seg{display:flex;margin-bottom:10px}
.seg button{flex:1;border-radius:0;font-weight:700}
.seg button:first-child{border-radius:8px 0 0 8px}
.seg button:last-child{border-radius:0 8px 8px 0;border-left:0}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.formula span{white-space:nowrap}
.gx{font-size:13px;font-weight:400;color:var(--sub);white-space:nowrap}
.copy{color:#5b6475;font-size:12px;text-align:center;margin:20px 0 4px}
</style>
</head>
<body>
<div class="wrap">
  <a href="../../" style="display:inline-block;color:#2f6fdf;text-decoration:none;font-size:15px;padding:6px 0">← 목록으로</a>
  <h1>용수철 진자의 단진동</h1>
  <p class="hint" id="hint"></p>

  <div class="card">
    <div class="seg" id="modeSeg"><button type="button" data-m="h" class="on">수평 진동</button><button type="button" data-m="v">수직 진동</button></div>
    <canvas id="sim"></canvas>
    <div id="tbar"></div>
    <div class="stats">
      <div class="stat" id="stTime"><div class="k">시간</div><div class="val"></div></div>
      <div class="stat"><div class="k">주기 T</div><div class="val" id="sT">-</div></div>
      <div class="stat tcell" id="stA"><div class="k">진폭 A</div><div class="val"><input type="number" id="aIn" min="0" step="0.01" inputmode="decimal" aria-label="진폭(m) 직접 입력"><i>m</i></div><div class="gx" id="aRatio" style="display:none"></div></div>
      <div class="stat"><div class="k" id="kX">변위 x</div><div class="val" id="sX" style="color:var(--xc)">-</div></div>
      <div class="stat"><div class="k" id="kV">속도 v</div><div class="val" id="sV" style="color:var(--vc)">-</div></div>
      <div class="stat"><div class="k">가속도 a</div><div class="val" id="sAc" style="color:var(--ac)">-</div></div>
    </div>
    <div class="formula" id="formula"></div>
  </div>

  <div class="card">
    <div class="controls">
      <div class="sl">
        <div class="top"><span>용수철 상수 k</span><b id="kVal"></b></div>
        <input type="range" id="kS" min="10" max="100" step="1" value="40">
        <div class="range"><span>10 N/m</span><span>100 N/m</span></div>
      </div>
      <div class="sl">
        <div class="top"><span>물체의 질량 m</span><b id="mVal"></b></div>
        <input type="range" id="mS" min="0.5" max="5" step="0.1" value="1">
        <div class="range"><span>0.5 kg</span><span>5.0 kg</span></div>
      </div>
    </div>
    <div class="row">
      <button id="pauseB" class="primary">일시 정지</button>
      <button id="resetB">처음으로</button>
      <label style="font-size:15px">재생 속도
        <select id="speedS">
          <option value="1">1배</option>
          <option value="0.5">0.5배</option>
          <option value="0.25">0.25배</option>
        </select>
      </label>
    </div>
  </div>

  <div class="card">
    <div class="checks">
      <label><input type="checkbox" id="cx" checked> <span style="color:var(--xc)">변위–시간</span></label>
      <label><input type="checkbox" id="cv"> <span style="color:var(--vc)">속도–시간</span></label>
      <label><input type="checkbox" id="ca"> <span style="color:var(--ac)">가속도–시간</span></label>
    </div>
    <canvas id="graph"></canvas>
    <div class="empty" id="noGraph" style="display:none">보고 싶은 그래프를 선택하세요.</div>
  </div>
  <p class="copy">© 2026 이정태. All Rights Reserved.</p>
</div>

<script>
/*TIMEBAR*/
// 시간 조절: host 안에 막대와 앞뒤 버튼을 만들고, 값 칸(#stats) 가운데 이름이 o.label(기본 '시간')로 시작하는 칸을 숫자 입력 칸으로 바꾼다.
// o: { max: () => 끝나는 시각(초), set: t => 그 시각으로 옮기기, step: 버튼 한 번에 움직이는 시간(기본 0.1), cell: 입력 칸으로 바꿀 요소를 돌려주는 함수(선택) }
// 반환한 show(t)를 매 프레임 부르면 막대와 숫자가 지금 시각을 따라간다.
function timeBar(host, o){
  const st = o.step || 0.1, lab = o.label || '시간';
  host.classList.add('tbar');
  host.innerHTML = '<div class="top"><span>시간 막대</span><span class="tb-r"><button class="b" type="button" data-d="-1">−' + st + '초</button><button class="b" type="button" data-d="1">+' + st + '초</button></span></div><input type="range" min="0" step="0.01" value="0" aria-label="시간 막대"><div class="range"><span>0 s</span><span class="tb-m"></span></div>';
  const bar = host.querySelector('input[type=range]'), mx = host.querySelector('.tb-m'); let cur = 0, num = null;
  const go = v => { const m = o.max(); o.set(Math.max(0, Math.min(isFinite(m) ? m : 1e9, v))); };
  bar.addEventListener('input', () => go(+bar.value));
  host.querySelectorAll('button').forEach(b => b.addEventListener('click', () => go((+b.dataset.d > 0 ? Math.floor(cur / st + 1e-6) + 1 : Math.ceil(cur / st - 1e-6) - 1) * st)));
  const findCell = o.cell || (() => [...document.querySelectorAll('#stats .stat')].find(e => e.firstChild.textContent.indexOf(lab) === 0));
  function attach(){ const c = findCell(); if (!c || c.dataset.edit) return; c.dataset.edit = '1'; c.classList.add('tcell');
    const v = c.querySelector('.val'); v.innerHTML = '<input type="number" min="0" step="' + st + '" inputmode="decimal" aria-label="시간(초) 직접 입력"><i>s</i>'; num = v.firstChild;
    num.addEventListener('input', () => { const x = parseFloat(num.value); if (isFinite(x)) go(x); });
    num.addEventListener('blur', () => { num.value = cur.toFixed(2); }); }
  return t => { cur = t; const m = o.max(), M = isFinite(m) ? m : Math.max(10, Math.ceil(t / 10) * 10); if (+bar.max !== M){ bar.max = M; mx.textContent = M.toFixed(2) + ' s'; } bar.value = t;
    if (!num || !num.isConnected) attach(); if (num && document.activeElement !== num) num.value = t.toFixed(2); };
}

// 가속도가 중력 가속도 g의 몇 배인지: 간단한 분수이면 분수로, 아니면 소수로 (예: 4/5 g, 0.17 g)
function gTxt(a){ const r = Math.abs(a) / 9.8; if (r < 0.0005) return '0'; for (let d = 1; d <= 12; d++){ const n = Math.round(r * d); if (n > 0 && Math.abs(r - n / d) < 0.0006) return (a < 0 ? '−' : '') + (d === 1 ? (n === 1 ? '' : n + ' ') : n + '/' + d + ' ') + 'g'; } return fmt(a / 9.8, 2) + ' g'; }
function fmt(v, d){ if (Math.abs(v) < 0.5 * Math.pow(10, -d)) v = 0; const s = v.toFixed(d); return (s === (-0).toFixed(d) ? (0).toFixed(d) : s).replace('-', '−'); }
const gAcc = a => fmt(a, 2) + ' m/s² <span class="gx">= ' + gTxt(a) + '</span>';
</script>
<script>
(function(){
  const simC = document.getElementById('sim'), sctx = simC.getContext('2d');
  const gC = document.getElementById('graph'), gctx = gC.getContext('2d');
  const kS = document.getElementById('kS'), mS = document.getElementById('mS');
  const kVal = document.getElementById('kVal'), mVal = document.getElementById('mVal');
  const pauseB = document.getElementById('pauseB'), resetB = document.getElementById('resetB');
  const speedS = document.getElementById('speedS');
  const FONT = '"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif';

  const MAXX = 0.5;     // 수평 진동에서 당길 수 있는 최대 변위 (m). 수직 진동은 3mg/k까지(작으면 0.5 m까지)
  const WINDOW = 10;    // 그래프 시간 폭 (s)
  const G = 9.8;

  let mode = 'h';       // 'h' 수평 진동, 'v' 수직 진동 (천장에 매단 용수철)
  let k = +kS.value, m = +mS.value;
  // phase: 'idle' 시작 전(평형점에 정지), 'drag' 잡고 있는 중(시간 멈춤), 'run' 놓은 뒤(놓은 순간이 t = 0)
  let phase = 'idle', A0 = 0, ph0 = 0, simTime = 0;
  let paused = false, speed = 1;
  let dragX = 0, grabOff = 0;
  let buf = [];

  const omega = () => Math.sqrt(k / m);
  const sag = () => m * G / k;              // 평형점에서 늘어난 길이 mg/k
  const acc = x => -k / m * x;
  // 놓은 뒤의 운동: x = A cos(ωt + φ)  (수직 진동에서는 새로운 평형점 기준, 위쪽이 +)
  function stateAt(t){
    if (phase === 'idle') return { x: 0, v: 0 };
    const w = omega(), th = w * t + ph0;
    return { x: A0 * Math.cos(th), v: -A0 * w * Math.sin(th) };
  }
  function state(){ return phase === 'drag' ? { x: dragX, v: 0 } : stateAt(simTime); }
  function sample(t){ const st = stateAt(t); return { t, x: st.x, v: st.v, a: acc(st.x) }; }

  function updateLabels(){ kVal.textContent = k + ' N/m'; mVal.textContent = m.toFixed(1) + ' kg'; }

  // k, m을 바꿀 때: 운동 중이면 지금 위치(수직 진동은 용수철이 늘어난 길이)와 속도를 이어 가도록 진폭과 위상을 다시 정한다.
  function change(apply){
    const st = state(), s0 = sag();
    apply(); updateLabels();
    if (phase !== 'run') return;
    const x = mode === 'v' ? st.x + (sag() - s0) : st.x, w = omega();
    A0 = Math.hypot(x, st.v / w);
    ph0 = Math.atan2(-st.v / w, x) - w * simTime;
  }
  kS.addEventListener('input', () => change(() => { k = +kS.value; }));
  mS.addEventListener('input', () => change(() => { m = +mS.value; }));

  function setPaused(p){ paused = p; pauseB.textContent = p ? '계속' : '일시 정지'; }
  pauseB.addEventListener('click', () => setPaused(!paused));
  function reset(){ phase = 'idle'; A0 = 0; ph0 = 0; simTime = 0; buf = []; setPaused(false); }
  resetB.addEventListener('click', reset);
  speedS.addEventListener('change', () => { speed = +speedS.value; });

  // ---------- 수평 / 수직 ----------
  const modeBtns = [...document.querySelectorAll('#modeSeg button')];
  function setMode(md){
    mode = md; reset();
    modeBtns.forEach(b => b.classList.toggle('on', b.dataset.m === md));
    simC.style.height = md === 'v' ? '400px' : '230px';
    document.getElementById('hint').textContent = md === 'v'
      ? '천장에 매단 용수철에 물체를 걸면 mg/k만큼 늘어난 곳이 새로운 평형점(x = 0)입니다. 물체를 위아래로 당겼다 놓거나 진폭 A 칸에 값을 넣으면(아래쪽 −A에서 놓음) 그 순간이 t = 0입니다. 진폭은 3mg/k까지(최소 0.5 m까지는 언제나), 위쪽이 (+), 공기 저항은 없다고 가정합니다.'
      : '물체를 잡아 옆으로 당겼다 놓거나 진폭 A 칸에 값을 넣으면(+A에서 놓음) 그 순간이 t = 0이고, 그때부터 시간과 그래프가 흐릅니다. 진폭은 0.5 m까지, 오른쪽이 (+), 마찰은 없다고 가정합니다.';
    document.getElementById('aRatio').style.display = md === 'v' ? '' : 'none';
    document.getElementById('kX').textContent = md === 'v' ? '변위 x (위 +)' : '변위 x';
    document.getElementById('kV').textContent = md === 'v' ? '속도 v (위 +)' : '속도 v';
    document.getElementById('formula').innerHTML = md === 'v'
      ? '<span>T = 2π√(m / k)</span>, <span>평형점에서 늘어난 길이 = mg / k</span> <span>(g = 9.8 m/s²)</span>'
      : 'T = 2π√(m / k)';
    resize();
  }
  modeBtns.forEach(b => b.addEventListener('click', () => { if (b.dataset.m !== mode) setMode(b.dataset.m); }));

  // ---------- 크기 ----------
  let W = 0, H = 0, GW = 0, GH = 0;
  const Q = [
    { key:'x', id:'cx', name:'변위 x', unit:'m',    color:'#2f6fdf', min:0.1 },
    { key:'v', id:'cv', name:'속도 v', unit:'m/s',  color:'#e0782f', min:0.5 },
    { key:'a', id:'ca', name:'가속도 a', unit:'m/s²', color:'#2e9e6a', min:1 }
  ];
  const PH = 130;
  function shownQ(){ return Q.filter(q => document.getElementById(q.id).checked); }
  function resize(){
    const dpr = window.devicePixelRatio || 1;
    W = simC.clientWidth; H = simC.clientHeight;
    simC.width = W * dpr; simC.height = H * dpr;
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = shownQ().length;
    document.getElementById('noGraph').style.display = n ? 'none' : 'block';
    gC.style.display = n ? 'block' : 'none';
    gC.style.height = (n * PH) + 'px';
    GW = gC.clientWidth; GH = n * PH;
    gC.width = GW * dpr; gC.height = GH * dpr;
    gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  Q.forEach(q => document.getElementById(q.id).addEventListener('change', resize));
  window.addEventListener('resize', resize);

  const maxA = () => mode === 'v' ? Math.max(MAXX, 3 * sag()) : MAXX;
  const range = () => Math.max(maxA(), phase === 'run' ? A0 : 0);
  const blockSize = () => (40 * Math.cbrt(m) + 10) * Math.max(0.7, Math.min(1, W / 600));
  function geomH(){
    const wallX = 26, s = blockSize(), R = range();
    const eqX = wallX + (W - wallX) * 0.45;
    const scale = Math.min((eqX - wallX - s / 2 - 40) / R, (W - eqX - s / 2 - 12) / R);
    return { wallX, eqX, scale, floorY: H - 64 };
  }
  // 수직: 천장 → 원래 길이(yN) → mg/k 아래 새로운 평형점(yE). 기준점은 용수철 아래 끝(물체 윗면).
  function geomV(){
    const s = blockSize(), R = range(), sg = sag(), minSp = 24;
    const avail = H - 28 - s - 34;
    const sc = Math.min((avail - 70) / (sg + R), (avail - minSp) / (2 * R));
    const L0 = Math.max(70, minSp + (R - sg) * sc);
    const top = 28 + Math.max(0, (avail - L0 - (sg + R) * sc) / 2);   // 남는 공간은 위아래로 나눈다
    const yN = top + L0;
    return { top, cx: W * 0.52, sc, yN, yE: yN + sg * sc };
  }

  // ---------- 그리기: 시뮬레이션 ----------
  function drawSpring(x1, x2, y, lw){
    const lead = 10, n = 12, amp = 11, L = x2 - x1 - 2 * lead;
    sctx.beginPath();
    sctx.moveTo(x1, y); sctx.lineTo(x1 + lead, y);
    for (let i = 0; i < n; i++){
      sctx.lineTo(x1 + lead + L * (i + 0.25) / n, y - amp);
      sctx.lineTo(x1 + lead + L * (i + 0.75) / n, y + amp);
    }
    sctx.lineTo(x2 - lead, y); sctx.lineTo(x2, y);
    sctx.lineWidth = lw; sctx.strokeStyle = '#3a4252'; sctx.lineJoin = 'round';
    sctx.stroke();
  }
  function drawSpringV(x, y1, y2, lw){
    const lead = 8, n = 12, amp = 11, L = y2 - y1 - 2 * lead;
    sctx.beginPath();
    sctx.moveTo(x, y1); sctx.lineTo(x, y1 + lead);
    for (let i = 0; i < n; i++){
      sctx.lineTo(x - amp, y1 + lead + L * (i + 0.25) / n);
      sctx.lineTo(x + amp, y1 + lead + L * (i + 0.75) / n);
    }
    sctx.lineTo(x, y2 - lead); sctx.lineTo(x, y2);
    sctx.lineWidth = lw; sctx.strokeStyle = '#3a4252'; sctx.lineJoin = 'round';
    sctx.stroke();
  }
  function arrow(ctx, xa, y, xb, color){
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(xa, y); ctx.lineTo(xb, y); ctx.stroke();
    const d = Math.sign(xb - xa) || 1;
    ctx.beginPath(); ctx.moveTo(xb, y); ctx.lineTo(xb - d * 9, y - 5); ctx.lineTo(xb - d * 9, y + 5); ctx.closePath(); ctx.fill();
  }
  function arrowV(x, ya, yb, color, both){
    sctx.strokeStyle = color; sctx.fillStyle = color; sctx.lineWidth = 2;
    sctx.beginPath(); sctx.moveTo(x, ya); sctx.lineTo(x, yb); sctx.stroke();
    const head = (y, d) => { sctx.beginPath(); sctx.moveTo(x, y); sctx.lineTo(x - 5, y - d * 8); sctx.lineTo(x + 5, y - d * 8); sctx.closePath(); sctx.fill(); };
    const d = Math.sign(yb - ya) || 1;
    head(yb, d); if (both) head(ya, -d);
  }
  function block(left, topY, s, cx){
    const dr = phase === 'drag';
    sctx.fillStyle = dr ? '#46536b' : '#5a6478';
    sctx.strokeStyle = dr ? '#2f6fdf' : '#2f3542'; sctx.lineWidth = dr ? 2.5 : 1.5;
    sctx.beginPath(); sctx.roundRect ? sctx.roundRect(left, topY, s, s, 4) : sctx.rect(left, topY, s, s);
    sctx.fill(); sctx.stroke();
    sctx.fillStyle = '#fff'; sctx.font = 'bold 12px ' + FONT; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText(m.toFixed(1) + ' kg', cx, topY + s / 2);
  }

  function drawH(st){
    const g = geomH(), s = blockSize();
    // 바닥
    sctx.fillStyle = '#e6e9ef'; sctx.fillRect(g.wallX, g.floorY, W - g.wallX, 6);
    sctx.strokeStyle = '#3a4252'; sctx.lineWidth = 1.5;
    sctx.beginPath(); sctx.moveTo(g.wallX, g.floorY); sctx.lineTo(W, g.floorY); sctx.stroke();
    // 벽
    const wallTop = g.floorY - 120;
    sctx.fillStyle = '#e6e9ef'; sctx.fillRect(g.wallX - 16, wallTop, 16, g.floorY - wallTop + 6);
    sctx.save(); sctx.beginPath(); sctx.rect(g.wallX - 16, wallTop, 16, g.floorY - wallTop + 6); sctx.clip();
    sctx.strokeStyle = '#9aa3b2'; sctx.lineWidth = 1;
    for (let yy = wallTop - 20; yy < g.floorY + 30; yy += 9){
      sctx.beginPath(); sctx.moveTo(g.wallX - 16, yy + 16); sctx.lineTo(g.wallX, yy); sctx.stroke();
    }
    sctx.restore();
    sctx.strokeStyle = '#3a4252'; sctx.lineWidth = 1.5;
    sctx.beginPath(); sctx.moveTo(g.wallX, wallTop); sctx.lineTo(g.wallX, g.floorY); sctx.stroke();
    // 눈금자
    sctx.font = '12px ' + FONT; sctx.textAlign = 'center'; sctx.textBaseline = 'top';
    sctx.strokeStyle = '#7b8494'; sctx.fillStyle = '#5b6475'; sctx.lineWidth = 1;
    const labelEvery = (0.1 * g.scale >= 34) ? 1 : 5;
    for (let i = -5; i <= 5; i++){
      const X = g.eqX + i * 0.1 * g.scale, big = (i % 5 === 0);
      sctx.beginPath(); sctx.moveTo(X, g.floorY + 8); sctx.lineTo(X, g.floorY + (big ? 20 : 15)); sctx.stroke();
      if (i % labelEvery === 0) sctx.fillText(fmt(i / 10, i === 0 ? 0 : 1), X, g.floorY + 23);
    }
    sctx.textAlign = 'right';
    sctx.fillText('x (m)', W - 6, g.floorY + 40);
    // 평형 위치
    sctx.setLineDash([5, 5]); sctx.strokeStyle = '#9aa3b2'; sctx.lineWidth = 1.2;
    sctx.beginPath(); sctx.moveTo(g.eqX, 22); sctx.lineTo(g.eqX, g.floorY); sctx.stroke();
    sctx.setLineDash([]);
    sctx.textAlign = 'center'; sctx.fillStyle = '#5b6475'; sctx.font = '12px ' + FONT;
    sctx.fillText('평형 위치', g.eqX, 6);
    // 물체와 용수철
    const bx = g.eqX + st.x * g.scale, left = bx - s / 2;
    drawSpring(g.wallX, left, g.floorY - s / 2, 1.2 + k / 45);
    block(left, g.floorY - s, s, bx);
    // 변위 화살표
    if (Math.abs(st.x) > 0.005){
      const ay = g.floorY - s - 14;
      arrow(sctx, g.eqX, ay, bx, '#2f6fdf');
      sctx.fillStyle = '#2f6fdf'; sctx.font = 'bold 13px ' + FONT; sctx.textAlign = 'center'; sctx.textBaseline = 'bottom';
      sctx.fillText('x', (g.eqX + bx) / 2, ay - 5);
    } else if (phase === 'idle'){
      sctx.fillStyle = '#2f6fdf'; sctx.font = 'bold 14px ' + FONT; sctx.textAlign = 'center'; sctx.textBaseline = 'bottom';
      sctx.fillText('← 물체를 잡아 당겨 보세요 →', bx, g.floorY - s - 10);
    }
  }

  function drawV(st){
    const g = geomV(), s = blockSize(), half = s / 2;
    const yb = g.yE - st.x * g.sc;            // 물체 윗면(용수철 아래 끝)
    const lineL = Math.max(8, g.cx - half - 118), lineR = Math.min(W - 6, g.cx + half + 78);
    const labR = g.cx - half - 32;            // 이름표 오른쪽 끝
    // 점선과 이름표
    const A = phase === 'run' ? A0 : phase === 'drag' ? Math.abs(dragX) : 0;
    const lines = [
      { y: g.yN, text: '원래 길이', color: '#7b8494' },
      { y: g.yE, text: '새 평형점 (x = 0)', color: '#2f6fdf' }
    ];
    if (A > 0.005){
      lines.push({ y: g.yE - A * g.sc, text: '+A', color: '#8a4fc7' });
      lines.push({ y: g.yE + A * g.sc, text: '−A', color: '#8a4fc7' });
    }
    sctx.lineWidth = 1.2; sctx.setLineDash([5, 4]);
    for (const L of lines){
      sctx.strokeStyle = L.color;
      sctx.beginPath(); sctx.moveTo(labR + 4, L.y); sctx.lineTo(lineR, L.y); sctx.stroke();
    }
    sctx.setLineDash([]);
    // 이름표가 겹치지 않게 위아래로 벌린다
    const tags = lines.map(L => ({ ...L, ty: L.y })).sort((a, b) => a.y - b.y);
    for (let i = 1; i < tags.length; i++) if (tags[i].ty < tags[i - 1].ty + 15) tags[i].ty = tags[i - 1].ty + 15;
    sctx.font = 'bold 12px ' + FONT; sctx.textAlign = 'right'; sctx.textBaseline = 'middle';
    for (const T of tags){
      sctx.fillStyle = T.color; sctx.fillText(T.text, labR, T.ty);
      if (Math.abs(T.ty - T.y) > 2){ sctx.strokeStyle = T.color; sctx.lineWidth = 1; sctx.beginPath(); sctx.moveTo(labR + 1, T.ty); sctx.lineTo(labR + 4, T.y); sctx.stroke(); }
    }
    // 천장
    const cw = Math.max(60, half + 30);
    sctx.fillStyle = '#e6e9ef'; sctx.fillRect(g.cx - cw, g.top - 14, 2 * cw, 14);
    sctx.save(); sctx.beginPath(); sctx.rect(g.cx - cw, g.top - 14, 2 * cw, 14); sctx.clip();
    sctx.strokeStyle = '#9aa3b2'; sctx.lineWidth = 1;
    for (let xx = g.cx - cw - 20; xx < g.cx + cw + 20; xx += 9){ sctx.beginPath(); sctx.moveTo(xx, g.top); sctx.lineTo(xx + 14, g.top - 14); sctx.stroke(); }
    sctx.restore();
    sctx.strokeStyle = '#3a4252'; sctx.lineWidth = 1.5;
    sctx.beginPath(); sctx.moveTo(g.cx - cw, g.top); sctx.lineTo(g.cx + cw, g.top); sctx.stroke();
    // 용수철과 물체
    drawSpringV(g.cx, g.top, yb, 1.2 + k / 45);
    block(g.cx - half, yb, s, g.cx);
    // 늘어난 길이 mg/k
    const ax = g.cx + half + 16, d = g.yE - g.yN;
    sctx.fillStyle = '#c0392b'; sctx.font = 'bold 12px ' + FONT; sctx.textAlign = 'left'; sctx.textBaseline = 'middle';
    if (d >= 18){
      arrowV(ax, g.yN, g.yE, '#c0392b', true);
      sctx.fillStyle = '#c0392b';
      sctx.fillText('mg/k', ax + 8, (g.yN + g.yE) / 2 - 8);
      sctx.fillText('= ' + sag().toFixed(2) + ' m', ax + 8, (g.yN + g.yE) / 2 + 8);
    } else {
      sctx.strokeStyle = '#c0392b'; sctx.lineWidth = 2;
      sctx.beginPath(); sctx.moveTo(ax, g.yN); sctx.lineTo(ax, g.yE); sctx.stroke();
      sctx.fillText('mg/k = ' + sag().toFixed(2) + ' m', ax + 8, (g.yN + g.yE) / 2);
    }
    // 변위 화살표 (새 평형점 → 물체 윗면)
    if (Math.abs(st.x) * g.sc > 8){
      const xx = g.cx - half - 17;
      arrowV(xx, g.yE, yb, '#2f6fdf', false);
      sctx.fillStyle = '#2f6fdf'; sctx.font = 'bold 13px ' + FONT; sctx.textAlign = 'left'; sctx.textBaseline = 'middle';
      sctx.fillText('x', xx + 5, (g.yE + yb) / 2);
    }
    if (phase === 'idle'){
      sctx.fillStyle = '#2f6fdf'; sctx.font = 'bold 14px ' + FONT; sctx.textAlign = 'center'; sctx.textBaseline = 'bottom';
      sctx.fillText('↕ 물체를 잡아 위아래로 당겨 보세요', W / 2, H - 6);
    }
  }

  function drawSim(st){ sctx.clearRect(0, 0, W, H); mode === 'v' ? drawV(st) : drawH(st); }

  function updateStats(st){
    const run = phase === 'run';
    document.getElementById('sT').textContent = (2 * Math.PI / omega()).toFixed(2) + ' s';
    const A = phase === 'drag' ? Math.abs(dragX) : run ? A0 : 0;
    aIn.max = maxA().toFixed(2);
    if (document.activeElement !== aIn) aIn.value = A.toFixed(2);
    const rt = mode === 'v' ? '= ' + ratioTxt(A / sag()) : '';
    if (aRatio.textContent !== rt) aRatio.textContent = rt;
    document.getElementById('sX').textContent = fmt(st.x, 2) + ' m';
    document.getElementById('sV').textContent = fmt(st.v, 2) + ' m/s';
    const a = acc(st.x), el = document.getElementById('sAc');
    const html = mode === 'v' ? gAcc(a) : fmt(a, 2) + ' m/s²';
    if (el.innerHTML !== html) el.innerHTML = html;
  }

  // ---------- 그리기: 그래프 ----------
  const NICE = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200];
  function niceMax(v, min){ v = Math.max(v, min); for (const n of NICE) if (n >= v * 0.999) return n; return NICE[NICE.length - 1]; }

  function drawGraphs(){
    const shown = shownQ();
    if (!shown.length) return;
    gctx.clearRect(0, 0, GW, GH);
    const L = 58, R = 40, pw = GW - L - R;
    const t1 = Math.max(simTime, WINDOW), t0 = t1 - WINDOW;
    shown.forEach((q, i) => {
      const top = i * PH + 10, h = PH - 34, mid = top + h / 2;
      let mx = 0; for (const p of buf) if (p.t >= t0) mx = Math.max(mx, Math.abs(p[q.key]));
      const Y = niceMax(mx, q.min);
      // 세로 격자 (1초마다)
      gctx.font = '11px ' + FONT; gctx.fillStyle = '#5b6475'; gctx.textAlign = 'center'; gctx.textBaseline = 'top';
      for (let s = Math.ceil(t0); s <= t1 + 1e-9; s++){
        const X = L + (s - t0) / WINDOW * pw;
        gctx.strokeStyle = '#eef0f4'; gctx.lineWidth = 1;
        gctx.beginPath(); gctx.moveTo(X, top); gctx.lineTo(X, top + h); gctx.stroke();
        gctx.fillText(String(s), X, top + h + 4);
      }
      gctx.textAlign = 'right'; gctx.textBaseline = 'middle'; gctx.fillText('t (s)', GW - 2, mid);
      // 테두리, 0선
      gctx.strokeStyle = '#d9dde4'; gctx.strokeRect(L, top, pw, h);
      gctx.strokeStyle = '#9aa3b2';
      gctx.beginPath(); gctx.moveTo(L, mid); gctx.lineTo(L + pw, mid); gctx.stroke();
      // 세로축 값
      gctx.textAlign = 'right'; gctx.textBaseline = 'middle'; gctx.fillStyle = '#5b6475';
      gctx.fillText(fmt(Y, Y < 1 ? 1 : 0), L - 6, top + 2);
      gctx.fillText('0', L - 6, mid);
      gctx.fillText(fmt(-Y, Y < 1 ? 1 : 0), L - 6, top + h - 2);
      // 이름
      gctx.textAlign = 'left'; gctx.textBaseline = 'top'; gctx.fillStyle = q.color; gctx.font = 'bold 13px ' + FONT;
      gctx.fillText(q.name + ' (' + q.unit + ')', L + 6, top + 4);
      if (!buf.length){
        gctx.fillStyle = '#5b6475'; gctx.font = '12px ' + FONT; gctx.textAlign = 'center'; gctx.textBaseline = 'bottom';
        gctx.fillText('당겼다 놓는 순간(t = 0)부터 그려집니다', L + pw / 2, top + h - 6);
      }
      // 곡선
      gctx.save(); gctx.beginPath(); gctx.rect(L, top, pw, h); gctx.clip();
      gctx.strokeStyle = q.color; gctx.lineWidth = 2.2; gctx.lineJoin = 'round';
      gctx.beginPath(); let started = false;
      for (const p of buf){
        if (p.t < t0) continue;
        const X = L + (p.t - t0) / WINDOW * pw, Yp = mid - p[q.key] / Y * (h / 2);
        if (!started){ gctx.moveTo(X, Yp); started = true; } else gctx.lineTo(X, Yp);
      }
      gctx.stroke(); gctx.restore();
    });
  }

  // ---------- 끌기 ----------
  function local(e){ const r = simC.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function onBlock(p){
    const s = blockSize(), x = state().x;
    if (mode === 'v'){
      const g = geomV(), yb = g.yE - x * g.sc;
      return Math.abs(p.x - g.cx) <= s / 2 + 22 && p.y >= yb - 24 && p.y <= yb + s + 24;
    }
    const g = geomH(), bx = g.eqX + x * g.scale;
    return Math.abs(p.x - bx) <= s / 2 + 22 && p.y >= g.floorY - s - 30 && p.y <= g.floorY + 24;
  }
  const clampX = v => Math.max(-maxA(), Math.min(maxA(), v));
  simC.addEventListener('pointerdown', e => {
    const p = local(e);
    if (!onBlock(p)) return;
    dragX = clampX(state().x); phase = 'drag';          // 잡는 동안 시간은 멈춘다
    if (mode === 'v'){ const g = geomV(); grabOff = p.y - (g.yE - dragX * g.sc); }
    else { const g = geomH(); grabOff = p.x - (g.eqX + dragX * g.scale); }
    simC.setPointerCapture(e.pointerId);
    simC.style.cursor = 'grabbing';
    e.preventDefault();
  });
  simC.addEventListener('pointermove', e => {
    const p = local(e);
    if (phase === 'drag'){
      if (mode === 'v'){ const g = geomV(); dragX = clampX((g.yE - (p.y - grabOff)) / g.sc); }
      else { const g = geomH(); dragX = clampX((p.x - grabOff - g.eqX) / g.scale); }
    } else {
      simC.style.cursor = onBlock(p) ? 'grab' : 'default';
    }
  });
  function release(){
    if (phase !== 'drag') return;
    simC.style.cursor = 'grab';
    if (Math.abs(dragX) < 0.003){ reset(); return; }
    // 놓는 순간이 t = 0
    phase = 'run'; A0 = Math.abs(dragX); ph0 = dragX < 0 ? Math.PI : 0;
    simTime = 0; buf = [sample(0)]; setPaused(false);
  }
  simC.addEventListener('pointerup', release);
  simC.addEventListener('pointercancel', release);

  // ---------- 진폭 직접 입력 ----------
  // 진폭 A를 넣으면 그 진폭으로 당겼다 놓은 것으로 보고 t = 0부터 시작한다 (수평: +A에서, 수직: 아래쪽 −A에서 놓음).
  const aIn = document.getElementById('aIn'), aRatio = document.getElementById('aRatio');
  aIn.addEventListener('change', () => {
    const v = parseFloat(aIn.value); if (!isFinite(v) || phase === 'drag') return;
    const a = Math.min(maxA(), Math.max(0, v));
    aIn.value = a.toFixed(2);
    if (a < 0.003){ reset(); return; }
    phase = 'run'; A0 = a; ph0 = mode === 'v' ? Math.PI : 0;
    simTime = 0; buf = [sample(0)]; setPaused(false);
  });
  aIn.addEventListener('keydown', e => { if (e.key === 'Enter') aIn.blur(); });
  // 진폭이 mg/k의 몇 배인지 (예: 2 mg/k, 3/2 mg/k, 1.37 mg/k)
  function ratioTxt(r){
    if (r < 0.0005) return '0';
    for (let d = 1; d <= 4; d++){ const n = Math.round(r * d); if (n > 0 && Math.abs(r - n / d) < 0.004) return (d === 1 ? (n === 1 ? '' : n + ' ') : n + '/' + d + ' ') + 'mg/k'; }
    return r.toFixed(2) + ' mg/k';
  }

  // ---------- 시각 고르기 ----------
  const showT = timeBar(document.getElementById('tbar'), { cell: () => document.getElementById('stTime'), max: () => Math.max(10, Math.ceil(simTime / 10) * 10), set: val => {
    if (phase !== 'run') return;
    setPaused(true); simTime = val; buf = [];
    for (let tt = Math.max(0, val - WINDOW); tt <= val + 1e-9; tt += 0.02) buf.push(sample(tt));
    buf.push(sample(val)); } });

  // ---------- 반복 ----------
  let last = performance.now();
  function frame(now){
    const dt = Math.max(0, Math.min((now - last) / 1000, 0.05)); last = now;
    if (!paused && phase === 'run'){
      simTime += dt * speed;
      buf.push(sample(simTime));
      while (buf.length && buf[0].t < simTime - WINDOW - 0.5) buf.shift();
    }
    const st = state(); showT(simTime);
    drawSim(st); updateStats(st); drawGraphs();
    requestAnimationFrame(frame);
  }

  updateLabels(); setMode('h');
  requestAnimationFrame(frame);
})();
</script>
<script>
/*SLIDER-EDIT*/
// 슬라이더 옆의 값을 누르면 숫자를 직접 입력할 수 있게 한다. (값 글자의 숫자가 슬라이더 값과 같을 때만)
setTimeout(function(){
  document.querySelectorAll('input[type=range]').forEach(function(r){
    if (r.closest('.tbar')) return; var box = r.parentElement, b = null;
    for (var i = 0; i < 2 && box; i++){ if (box.querySelectorAll('input[type=range]').length === 1){ b = box.querySelector('b'); if (b) break; } box = box.parentElement; }
    if (!b || b.querySelector('input')) return;
    function same(){ var m = (b.textContent || '').replace(/−/g, '-').match(/-?\d+(\.\d+)?/); if (!m) return false; var dec = m[1] ? m[1].length - 1 : 0; return Math.abs(parseFloat(m[0]) - (+r.value)) <= 0.5 * Math.pow(10, -dec) + 1e-9; }
    if (!same()) return;
    b.style.borderBottom = '1px dashed currentColor'; b.style.cursor = 'text'; b.title = '눌러서 숫자 입력';
    r.addEventListener('pointerdown', function(){ if (r.dataset.step){ r.step = r.dataset.step; delete r.dataset.step; } });
    b.addEventListener('click', function(){
      if (r.disabled || !same() || b.style.display === 'none') return;
      var n = document.createElement('input'); n.type = 'number'; n.min = r.min; n.max = r.max; n.step = 'any'; n.value = r.value; n.setAttribute('inputmode', 'decimal'); n.setAttribute('aria-label', '값 직접 입력');
      n.style.cssText = 'font:inherit;font-weight:700;color:inherit;width:84px;padding:2px 6px;border:1.5px solid currentColor;border-radius:6px;text-align:right;background:#fff';
      b.style.display = 'none'; b.parentNode.insertBefore(n, b.nextSibling); n.focus(); n.select();
      var done = false;
      function finish(apply){ if (done) return; done = true; var v = parseFloat(n.value);
        if (apply && isFinite(v)){ v = Math.max(+r.min, Math.min(+r.max, v)); var st = parseFloat(r.dataset.step || r.step) || 1, q = (v - (+r.min)) / st;
          if (Math.abs(q - Math.round(q)) > 1e-6){ if (!r.dataset.step) r.dataset.step = r.step; r.step = 'any'; } else if (r.dataset.step){ r.step = r.dataset.step; delete r.dataset.step; }
          r.value = v; r.dispatchEvent(new Event('input', { bubbles: true })); r.dispatchEvent(new Event('change', { bubbles: true })); }
        n.remove(); b.style.display = ''; }
      n.addEventListener('keydown', function(e){ if (e.key === 'Enter') finish(true); else if (e.key === 'Escape') finish(false); });
      n.addEventListener('blur', function(){ finish(true); });
    });
  });
}, 0);
/*SLIDER-EDIT-END*/
</script>
