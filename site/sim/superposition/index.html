<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>파동의 중첩</title>
<style>
:root{ --bg:#f4f6f9; --panel:#fff; --ink:#1d2330; --sub:#5b6475; --line:#d9dde4; --accent:#2f6fdf; }
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.back{display:none;color:var(--accent);text-decoration:none;font-size:15px;padding:6px 0}
h1{font-size:22px;margin:4px 0}
.hint{color:var(--sub);font-size:14px;margin:0 0 12px;line-height:1.5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{flex:1 1 0;min-width:72px;font:inherit;font-size:14px;padding:10px 2px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
canvas{display:block;width:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:8px;margin-top:10px}
.stat{background:var(--bg);border-radius:8px;padding:8px;text-align:center}
.stat .k{font-size:12px;color:var(--sub)}
.stat .val{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.sl .top{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;gap:8px}
.sl .top b{font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
.sl input[type=range]{width:100%;margin:10px 0 2px;accent-color:var(--accent);height:28px}
.sl .range{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.sl select{width:100%;margin-top:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
select{max-width:100%;text-overflow:ellipsis}
button.b,select{font:inherit;font-size:15px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;touch-action:manipulation}
button.b.on,button.b.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
label.chk{display:flex;align-items:center;gap:6px;font-size:15px;cursor:pointer}
label.chk input{width:18px;height:18px}
.hide{display:none!important}
.note{font-size:13px;color:var(--sub);margin:8px 0 0;line-height:1.55}
@media (max-width:640px){ .controls{grid-template-columns:1fr} h1{font-size:19px} }
.tbar{margin-top:12px}
.tbar .top{display:flex;justify-content:space-between;align-items:center;font-size:15px;gap:8px;flex-wrap:wrap}
.tbar .tb-r{display:flex;align-items:center;gap:6px}
.tbar .tb-r button.b{padding:7px 10px;font-size:14px}
.tbar input[type=range]{width:100%;margin:10px 0 2px;accent-color:var(--accent);height:28px}
.tbar .range{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.stat.tcell{outline:1.5px solid var(--accent);background:#fff}
.stat.tcell .k::after{content:" (직접 입력)";color:var(--accent)}
.stat.tcell .val{display:flex;justify-content:center;align-items:baseline;gap:3px}
.stat.tcell input{font:inherit;font-weight:700;color:var(--ink);width:72px;padding:1px 2px;border:0;border-bottom:1.5px solid var(--accent);border-radius:0;background:transparent;text-align:right;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stat.tcell input::-webkit-outer-spin-button,.stat.tcell input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stat.tcell i{font-style:normal;font-weight:700}
.gx{font-size:13px;font-weight:400;color:var(--sub);white-space:nowrap}
.copy{color:#5b6475;font-size:12px;text-align:center;margin:20px 0 4px}

.wh{font-size:16px;margin:0 0 10px}.wh span{font-size:13px;font-weight:400;color:var(--sub);margin-left:6px}

</style>
</head>
<body>
<div class="wrap">
  <a class="back" id="back" href="../../">← 목록으로</a>
<h1>파동의 중첩</h1>
  <p class="hint" id="hintTxt"></p>
  <div class="card">
    <div class="tabs" id="tabs">
      <button data-m="opp">마주 보고 진행</button>
      <button data-m="same">같은 곳에서 출발</button>
    </div>
    <canvas id="sim" style="height:350px;border-radius:8px;background:#fbfcfd"></canvas>
    <div class="row">
      <button class="b primary" id="goB">시작</button><button class="b" id="resetB">처음으로</button>
    </div>
    <div id="tbar"></div>
    <div class="row">
      <select id="kindS"><option value="wave">연속으로 발생하는 파동</option><option value="pulse">한 파장만 발생 (펄스)</option></select>
      <select id="spS"><option value="1">실제 빠르기</option><option value="0.5" selected>0.5배로 느리게</option><option value="0.25">0.25배로 느리게</option></select>
    </div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="card">
    <h2 class="wh" style="color:#2f6fdf">파동 1 <span id="d1"></span></h2>
    <div class="controls">
      <div class="sl"><div class="top"><span>진폭</span><b id="a1V"></b></div>
        <input type="range" id="a1S" min="0" max="3" step="0.5" value="2"><div class="range"><span>0</span><span>3 cm</span></div></div>
      <div class="sl"><div class="top"><span>진동수</span><b id="f1V"></b></div>
        <input type="range" id="f1S" min="0.25" max="2" step="0.25" value="0.5"><div class="range"><span>0.25 Hz</span><span>2 Hz</span></div></div>
      <div class="sl"><div class="top"><span>파장</span><b id="l1V"></b></div>
        <input type="range" id="l1S" min="1" max="6" step="0.5" value="2"><div class="range"><span>1 m</span><span>6 m</span></div></div>
    </div>
  </div>
  <div class="card">
    <h2 class="wh" style="color:#e0782f">파동 2 <span id="d2"></span></h2>
    <div class="row" style="margin:0 0 10px"><label class="chk"><input type="checkbox" id="cSame"> 파동 1과 같게 맞추기</label></div>
    <div class="controls" id="w2">
      <div class="sl"><div class="top"><span>진폭</span><b id="a2V"></b></div>
        <input type="range" id="a2S" min="0" max="3" step="0.5" value="2"><div class="range"><span>0</span><span>3 cm</span></div></div>
      <div class="sl"><div class="top"><span>진동수</span><b id="f2V"></b></div>
        <input type="range" id="f2S" min="0.25" max="2" step="0.25" value="0.5"><div class="range"><span>0.25 Hz</span><span>2 Hz</span></div></div>
      <div class="sl"><div class="top"><span>파장</span><b id="l2V"></b></div>
        <input type="range" id="l2S" min="1" max="6" step="0.5" value="2"><div class="range"><span>1 m</span><span>6 m</span></div></div>
    </div>
    <div class="controls" style="margin-top:14px">
      <div class="sl m-same"><div class="top"><span>파동 2가 늦게 출발하는 정도 (위상 차)</span><b id="phV"></b></div>
        <input type="range" id="phS" min="0" max="360" step="30" value="0"><div class="range"><span>0° (동시에)</span><span>360° (한 주기 늦게)</span></div></div>
    </div>
  </div>
  <div class="card">
    <div class="sl"><div class="top"><span>관찰하는 점 P의 위치</span><b id="pV"></b></div>
      <input type="range" id="pS" min="0" max="12" step="0.5" value="6"><div class="range"><span>0 m</span><span>12 m</span></div></div>
    <p class="note" id="noteTxt"></p>
  </div>
  <p class="copy">© 2026 이정태. All Rights Reserved.</p>
</div>
<script>
(function(){
const $ = id => document.getElementById(id);
const FONT = '"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif';
const INK = '#1d2330', SUB = '#5b6475', GRAY = '#9aa3b2', WIRE = '#3a4252', BLUE = '#2f6fdf', RED = '#d64541', ORANGE = '#e0782f', GREEN = '#2e9e6a', PURPLE = '#8e44ad', YELLOW = '#e0a400';
if (/\/sim\//.test(location.pathname) && location.protocol.startsWith('http')) $('back').style.display = 'inline-block';
// 캔버스 크기 맞추기: {ctx, W, H}
function fitCanvas(c){ const d = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight; c.width = w * d; c.height = h * d; const x = c.getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0); return { ctx: x, W: w, H: h }; }
function T(ctx, s, x, y, o){ o = o || {}; ctx.fillStyle = o.color || SUB; ctx.font = (o.bold ? 'bold ' : '') + (o.size || 12) + 'px ' + FONT; ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle'; ctx.fillText(s, x, y); }
function line(ctx, pts, color, lw, dash){ ctx.strokeStyle = color || WIRE; ctx.lineWidth = lw || 2; ctx.setLineDash(dash ? (dash === true ? [5, 4] : dash) : []); ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); ctx.setLineDash([]); }
function arrow(ctx, x1, y1, x2, y2, color, lw, hs){
  const L = Math.hypot(x2 - x1, y2 - y1); if (L < 2) return; hs = hs || Math.min(10, 4 + L * 0.3); const ux = (x2 - x1) / L, uy = (y2 - y1) / L;
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw || 2.5; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - ux * hs * 0.8, y2 - uy * hs * 0.8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - ux * hs - uy * hs * 0.55, y2 - uy * hs + ux * hs * 0.55); ctx.lineTo(x2 - ux * hs + uy * hs * 0.55, y2 - uy * hs - ux * hs * 0.55); ctx.closePath(); ctx.fill(); }
let _clockLabel = null, _clockOn = () => true;
function setStats(items){ if (_clockLabel && _clockOn() && !items.some(i => i[0].indexOf(_clockLabel) === 0)) items = [[_clockLabel, '']].concat(items);
  const box = $('stats'), key = items.map(i => i[0]).join('|');
  if (box.dataset.k !== key){ box.dataset.k = key; box.innerHTML = items.map(([k, v, c]) => `<div class="stat"><div class="k">${k}</div><div class="val"${c ? ` style="color:${c}"` : ''}>${v}</div></div>`).join(''); return; }
  items.forEach(([k, v, c], i) => { const cell = box.children[i]; if (cell.dataset.edit) return; const e = cell.lastChild; if (e.textContent !== String(v)) e.innerHTML = v; e.style.color = c || ''; }); }
const fmt = (v, d) => { const s = (+v).toFixed(d); return (+s === 0 ? (0).toFixed(d) : s).replace('-', '−'); };
// 슬라이더 값 표시: {슬라이더id: [표시id, 값 => 문자열]}
function bindLabels(map){ const up = () => { for (const k in map){ const [lid, f] = map[k]; $(lid).textContent = f(+$(k).value, $(k)); } }; for (const k in map) $(k).addEventListener('input', up); up(); return up; }
function niceMax(v){ v = Math.max(v, 1e-9); const p = Math.pow(10, Math.floor(Math.log10(v))); for (const k of [1, 2, 2.5, 5, 10]) if (k * p >= v * 0.999) return k * p; return 10 * p; }
// 탭: 버튼에 data-m, 요소에 class="m-이름"
function setupTabs(onChange){
  const btns = document.querySelectorAll('#tabs button');
  const go = m => { btns.forEach(b => b.classList.toggle('on', b.dataset.m === m));
    document.querySelectorAll('[class*="m-"]').forEach(e => { const cl = [...e.classList].filter(k => k.startsWith('m-')); if (cl.length) e.classList.toggle('hide', !cl.includes('m-' + m)); });
    onChange(m); };
  btns.forEach(b => b.addEventListener('click', () => go(b.dataset.m))); go(btns[0].dataset.m); return go; }
// 시간 그래프. panels: [{keys:[...], names:[...], colors:[...], min: 최소 범위, pos: true면 0부터 위로만}]
function timeGraph(ctx, W, H, buf, t, panels, win){
  win = win || 10; ctx.clearRect(0, 0, W, H);
  const ph = H / panels.length, L = 50, R = 36, pw = W - L - R, t1 = Math.max(t, win), t0 = t1 - win;
  panels.forEach((p, k) => {
    const top = k * ph + 20, h = ph - 42; let mx = p.min || 1;
    for (const b of buf) if (b.t >= t0) for (const key of p.keys) mx = Math.max(mx, Math.abs(b[key]));
    const Y = p.fixed || niceMax(mx * 1.05), lo = p.pos ? 0 : -Y, yy = v => top + h - (v - lo) / (Y - lo) * h;
    ctx.font = 'bold 12px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; let lx = L;
    p.keys.forEach((key, i) => { ctx.fillStyle = p.colors[i]; ctx.fillText(p.names[i], lx, top - 3); lx += ctx.measureText(p.names[i]).width + 14; });
    ctx.strokeStyle = '#d9dde4'; ctx.lineWidth = 1; ctx.strokeRect(L, top, pw, h);
    ctx.strokeStyle = GRAY; ctx.beginPath(); ctx.moveTo(L, yy(0)); ctx.lineTo(L + pw, yy(0)); ctx.stroke();
    ctx.font = '11px ' + FONT; ctx.fillStyle = SUB; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    const lab = v => String(+v.toPrecision(3)).replace('-', '−');
    ctx.fillText(lab(Y), L - 4, top + 4); ctx.fillText('0', L - 4, yy(0)); if (!p.pos) ctx.fillText(lab(-Y), L - 4, top + h - 4);
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const st = win > 20 ? 5 : 1; for (let s = Math.ceil(t0 / st) * st; s <= t1 + 1e-9; s += st) ctx.fillText(String(s), L + (s - t0) / win * pw, top + h + 3);
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText('t (s)', W - 2, yy(0));
    ctx.save(); ctx.beginPath(); ctx.rect(L, top, pw, h); ctx.clip();
    p.keys.forEach((key, i) => { ctx.strokeStyle = p.colors[i]; ctx.lineWidth = 2.2; ctx.beginPath(); let s = false;
      for (const b of buf){ if (b.t < t0 || b[key] === undefined) continue; const X = L + (b.t - t0) / win * pw, Yp = yy(b[key]); s ? ctx.lineTo(X, Yp) : (ctx.moveTo(X, Yp), s = true); }
      ctx.stroke(); });
    ctx.restore(); });
}
// x–y 그래프 축. 반환: {X, Y} 변환 함수
function axes(ctx, W, H, o){
  const L = o.L || 52, R = o.R || 14, top = o.top || 14, B = o.B || 40, pw = W - L - R, h = H - top - B;
  const X = v => L + (v - o.x0) / (o.x1 - o.x0) * pw, Y = v => top + h - (v - o.y0) / (o.y1 - o.y0) * h;
  ctx.strokeStyle = '#d9dde4'; ctx.lineWidth = 1; ctx.strokeRect(L, top, pw, h);
  ctx.font = '11px ' + FONT; ctx.fillStyle = SUB;
  (o.xt || []).forEach(v => { ctx.strokeStyle = '#eef0f4'; ctx.beginPath(); ctx.moveTo(X(v), top); ctx.lineTo(X(v), top + h); ctx.stroke(); ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText(String(v), X(v), top + h + 3); });
  (o.yt || []).forEach(v => { ctx.strokeStyle = '#eef0f4'; ctx.beginPath(); ctx.moveTo(L, Y(v)); ctx.lineTo(L + pw, Y(v)); ctx.stroke(); ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText(String(v), L - 4, Y(v)); });
  if (o.xl){ ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText(o.xl, L + pw / 2, top + h + 18); }
  if (o.yl){ ctx.save(); ctx.translate(11, top + h / 2); ctx.rotate(-Math.PI / 2); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(o.yl, 0, 0); ctx.restore(); }
  return { X, Y, L, top, pw, h };
}
function loop(fn){ let last = performance.now(); const f = now => { const dt = Math.max(0, Math.min((now - last) / 1000, 0.05)); last = now; fn(dt, now / 1000); requestAnimationFrame(f); }; requestAnimationFrame(f); }
function pointer(c, down, move, up){
  const loc = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }; let active = false;
  c.addEventListener('pointerdown', e => { const [x, y] = loc(e); if (down(x, y) !== false){ active = true; c.setPointerCapture(e.pointerId); e.preventDefault(); } });
  c.addEventListener('pointermove', e => { if (active){ const [x, y] = loc(e); move && move(x, y); } });
  const end = () => { if (active){ active = false; up && up(); } }; c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
}
// 소리 (Web Audio)
let _ac = null;
function audio(){ if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)(); if (_ac.state === 'suspended') _ac.resume(); return _ac; }
function tone(){ const ac = audio(), o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0; o.connect(g).connect(ac.destination); o.start();
  return { set(f, v){ o.frequency.setTargetAtTime(f, ac.currentTime, 0.02); g.gain.setTargetAtTime(v, ac.currentTime, 0.03); }, stop(){ g.gain.setTargetAtTime(0, ac.currentTime, 0.03); setTimeout(() => o.stop(), 200); } }; }
// 파장(nm) → [r,g,b] (0~1)
function lamRGB(l){ let r = 0, g = 0, b = 0;
  if (l < 440){ r = -(l - 440) / 60; b = 1; } else if (l < 490){ g = (l - 440) / 50; b = 1; } else if (l < 510){ g = 1; b = -(l - 510) / 20; }
  else if (l < 580){ r = (l - 510) / 70; g = 1; } else if (l < 645){ r = 1; g = -(l - 645) / 65; } else r = 1;
  const f = l < 380 || l > 750 ? 0 : l < 420 ? 0.3 + 0.7 * (l - 380) / 40 : l > 680 ? 0.3 + 0.7 * (750 - l) / 70 : 1; return [Math.max(0, r) * f, Math.max(0, g) * f, Math.max(0, b) * f]; }
const rgbCss = (c, k = 1, a = 1) => `rgba(${Math.round(255 * Math.min(1, c[0] * k))},${Math.round(255 * Math.min(1, c[1] * k))},${Math.round(255 * Math.min(1, c[2] * k))},${a})`;

// 시간 조절: host 안에 막대와 앞뒤 버튼을 만들고, 값 칸(#stats) 가운데 이름이 o.label(기본 '시간')로 시작하는 칸을 숫자 입력 칸으로 바꾼다.
// o: { max: () => 끝나는 시각(초), set: t => 그 시각으로 옮기기, step: 버튼 한 번에 움직이는 시간(기본 0.1), cell: 입력 칸으로 바꿀 요소를 돌려주는 함수(선택) }
// 반환한 show(t)를 매 프레임 부르면 막대와 숫자가 지금 시각을 따라간다.
function timeBar(host, o){
  const st = o.step || 0.1, lab = o.label || '시간';
  host.classList.add('tbar');
  host.innerHTML = '<div class="top"><span>시간 막대</span><span class="tb-r"><button class="b" type="button" data-d="-1">−' + st + '초</button><button class="b" type="button" data-d="1">+' + st + '초</button></span></div><input type="range" min="0" step="0.01" value="0" aria-label="시간 막대"><div class="range"><span>0 s</span><span class="tb-m"></span></div>';
  const bar = host.querySelector('input[type=range]'), mx = host.querySelector('.tb-m'); let cur = 0, num = null;
  const go = v => { const m = o.max(); o.set(Math.max(0, Math.min(isFinite(m) ? m : 1e9, v))); };
  bar.addEventListener('input', () => go(+bar.value));
  host.querySelectorAll('button').forEach(b => b.addEventListener('click', () => go((+b.dataset.d > 0 ? Math.floor(cur / st + 1e-6) + 1 : Math.ceil(cur / st - 1e-6) - 1) * st)));
  const findCell = o.cell || (() => [...document.querySelectorAll('#stats .stat')].find(e => e.firstChild.textContent.indexOf(lab) === 0));
  function attach(){ const c = findCell(); if (!c || c.dataset.edit) return; c.dataset.edit = '1'; c.classList.add('tcell');
    const v = c.querySelector('.val'); v.innerHTML = '<input type="number" min="0" step="' + st + '" inputmode="decimal" aria-label="시간(초) 직접 입력"><i>s</i>'; num = v.firstChild;
    num.addEventListener('input', () => { const x = parseFloat(num.value); if (isFinite(x)) go(x); });
    num.addEventListener('blur', () => { num.value = cur.toFixed(2); }); }
  return t => { cur = t; const m = o.max(), M = isFinite(m) ? m : Math.max(10, Math.ceil(t / 10) * 10); if (+bar.max !== M){ bar.max = M; mx.textContent = M.toFixed(2) + ' s'; } bar.value = t;
    if (!num || !num.isConnected) attach(); if (num && document.activeElement !== num) num.value = t.toFixed(2); };
}

// 가속도가 중력 가속도 g의 몇 배인지: 간단한 분수이면 분수로, 아니면 소수로 (예: 4/5 g, 0.17 g)
function gTxt(a){ const r = Math.abs(a) / 9.8; if (r < 0.0005) return '0'; for (let d = 1; d <= 12; d++){ const n = Math.round(r * d); if (n > 0 && Math.abs(r - n / d) < 0.0006) return (a < 0 ? '−' : '') + (d === 1 ? (n === 1 ? '' : n) : n + '/' + d + ' ') + 'g'; } return fmt(a / 9.8, 2) + ' g'; }
const gAcc = a => fmt(a, 2) + ' m/s² <span class="gx">= ' + gTxt(a) + '</span>';
// 시계가 달린 반복 실행. fn(dt)를 매 프레임 부르되, 시간 막대와 '시간' 칸으로 원하는 시각을 고를 수 있게 한다.
// 뒤로 갈 때는 o.reset()으로 처음 상태를 만든 뒤 원하는 시각까지 빠르게 다시 계산한다(결과가 항상 같아야 하므로 무작위 요소가 없는 시뮬레이션에만 쓴다).
// o: { reset: 처음 상태로, start: 출발시키기(선택), active: () => 지금 운동 중인지(선택, 없으면 항상 진행), label: 시간 칸 이름(기본 '시간'), max: () => 막대 끝(선택), step, onPause: b => 버튼 글자 바꾸기 }
// 반환: { zero(): 시계를 0으로, toggle(): 일시 정지/계속, paused(), t() }
function loopT(fn, o){
  let T = 0, paused = false, want = null, inReplay = false;
  let host = $('tbar'); if (!host){ host = document.createElement('div'); host.id = 'tbar'; const st = $('stats'); st.parentNode.insertBefore(host, st); }
  _clockLabel = o.label || '시간'; if (o.visible) _clockOn = o.visible;
  const act = () => !o.active || o.active();
  const setP = b => { paused = b; if (o.onPause) o.onPause(b); };
  const show = timeBar(host, { label: _clockLabel, step: o.step, max: () => o.max ? o.max() : Math.max(10, Math.ceil(T / 10) * 10), set: v => { want = v; } });
  loop(dt => {
    if (want !== null){ const v = want; want = null; inReplay = true;
      if (v < T - 1e-9 || !act()){ o.reset(); T = 0; if (o.start) o.start(); }
      let n = 0; while (T < v - 1e-9 && n < 6000 && act()){ const h = Math.min(1 / 120, v - T); fn(h); T += h; n++; }
      inReplay = false; setP(true); }
    if (!paused && act()){ fn(dt); T += dt; } else fn(0);
    show(T); });
  return { zero(){ if (!inReplay){ T = 0; if (paused) setP(false); } }, toggle(){ setP(!paused); }, paused: () => paused, t: () => T };
}

// 슬라이더 옆의 값을 누르면 숫자를 직접 입력할 수 있게 한다. (값 글자의 숫자가 슬라이더 값과 같을 때만)

    if (!b || b.querySelector('input')) return;
    function same(){ var m = (b.textContent || '').replace(/−/g, '-').match(/-?\d+(\.\d+)?/); if (!m) return false; var dec = m[1] ? m[1].length - 1 : 0; return Math.abs(parseFloat(m[0]) - (+r.value)) <= 0.5 * Math.pow(10, -dec) + 1e-9; }
    if (!same()) return;
    b.style.borderBottom = '1px dashed currentColor'; b.style.cursor = 'text'; b.title = '눌러서 숫자 입력';
    r.addEventListener('pointerdown', function(){ if (r.dataset.step){ r.step = r.dataset.step; delete r.dataset.step; } });
    b.addEventListener('click', function(){
      if (r.disabled || !same() || b.style.display === 'none') return;
      var n = document.createElement('input'); n.type = 'number'; n.min = r.min; n.max = r.max; n.step = 'any'; n.value = r.value; n.setAttribute('inputmode', 'decimal'); n.setAttribute('aria-label', '값 직접 입력');
      n.style.cssText = 'font:inherit;font-weight:700;color:inherit;width:84px;padding:2px 6px;border:1.5px solid currentColor;border-radius:6px;text-align:right;background:#fff';
      b.style.display = 'none'; b.parentNode.insertBefore(n, b.nextSibling); n.focus(); n.select();

        if (apply && isFinite(v)){ v = Math.max(+r.min, Math.min(+r.max, v)); var st = parseFloat(r.dataset.step || r.step) || 1, q = (v - (+r.min)) / st;
          if (Math.abs(q - Math.round(q)) > 1e-6){ if (!r.dataset.step) r.dataset.step = r.step; r.step = 'any'; } else if (r.dataset.step){ r.step = r.dataset.step; delete r.dataset.step; }
          r.value = v; r.dispatchEvent(new Event('input', { bubbles: true })); r.dispatchEvent(new Event('change', { bubbles: true })); }

const S = $('sim'); let s; const rs = () => { s = fitCanvas(S); }; window.addEventListener('resize', rs);
const LX = 12;   // 줄의 길이 (m)
let mode, t = 0, run = false;
const up = bindLabels({ a1S: ['a1V', v => v.toFixed(1) + ' cm'], f1S: ['f1V', v => v.toFixed(2) + ' Hz'], l1S: ['l1V', v => v.toFixed(1) + ' m'],
  a2S: ['a2V', v => v.toFixed(1) + ' cm'], f2S: ['f2V', v => v.toFixed(2) + ' Hz'], l2S: ['l2V', v => v.toFixed(1) + ' m'], phS: ['phV', v => v + '°'], pS: ['pV', v => 'x = ' + v.toFixed(1) + ' m'] });
function waves(){
  const w1 = { A: +$('a1S').value, f: +$('f1S').value, l: +$('l1S').value, lag: 0, right: true };
  const w2 = { A: +$('a2S').value, f: +$('f2S').value, l: +$('l2S').value, lag: mode === 'same' ? +$('phS').value / 360 / +$('f2S').value : 0, right: mode === 'same' };
  w1.v = w1.f * w1.l; w2.v = w2.f * w2.l; return [w1, w2];
}
// 파원에서 떨어진 거리 d인 곳의 변위: 파동이 도착한 뒤부터 진동한다. 처음에는 위(+)로 움직이기 시작한다.
function disp(w, x, tt){ const d = w.right ? x : LX - x, tau = tt - w.lag - d / w.v; if (tau < 0) return 0; if ($('kindS').value === 'pulse' && tau > 1 / w.f) return 0; return w.A * Math.sin(2 * Math.PI * w.f * tau); }
function reset(){ t = 0; run = false; $('goB').textContent = '시작'; }
function setT(v){ run = false; t = Math.max(0, v); $('goB').textContent = t > 0 ? '계속' : '시작'; }
function draw(dt){
  if (run) t += dt * +$('spS').value;
  showT(t);
  const { ctx, W, H } = s, ws = waves(), L = 34, R = 10, pw = W - L - R, X = x => L + x / LX * pw;
  ctx.clearRect(0, 0, W, H);
  const sc = Math.max(2, ws[0].A + ws[1].A), rows = [{ y: 52, h: 34, lab: '파동 1의 변위 (cm)', c: BLUE, f: x => disp(ws[0], x, t) }, { y: 138, h: 34, lab: '파동 2의 변위 (cm)', c: ORANGE, f: x => disp(ws[1], x, t) },
    { y: 256, h: 62, lab: '합성파의 변위 (cm) = 두 변위의 합', c: PURPLE, f: x => disp(ws[0], x, t) + disp(ws[1], x, t) }];
  const px = +$('pS').value;
  // 세로 눈금선 (1 m 간격)
  for (let x = 0; x <= LX; x++){ line(ctx, [[X(x), 14], [X(x), H - 22]], x % 2 ? '#f1f3f7' : '#e6e9ef', 1); if (x % 2 === 0) T(ctx, String(x), X(x), H - 12, { size: 11 }); }
  T(ctx, 'x(m)', L - 6, H - 12, { size: 10, align: 'right' });
  line(ctx, [[X(px), 14], [X(px), H - 22]], GREEN, 1.5, [4, 3]); T(ctx, 'P', X(px), 8, { color: GREEN, bold: true, size: 12 });
  rows.forEach((r, k) => {
    const hh = r.h, Y = v => r.y - v / sc * hh, top = k === 2 ? sc : Math.max(ws[0].A, ws[1].A, 1);
    line(ctx, [[L, r.y], [L + pw, r.y]], GRAY, 1);
    T(ctx, r.lab, L + 2, r.y - hh - 9, { align: 'left', color: r.c, bold: true, size: 12 });
    T(ctx, fmt(top, top % 1 ? 1 : 0), L - 4, Y(top), { align: 'right', size: 10 }); T(ctx, '0', L - 4, r.y, { align: 'right', size: 10 }); T(ctx, fmt(-top, top % 1 ? 1 : 0), L - 4, Y(-top), { align: 'right', size: 10 });
    line(ctx, [[L, Y(top)], [L + pw, Y(top)]], '#eef0f4', 1, [2, 3]); line(ctx, [[L, Y(-top)], [L + pw, Y(-top)]], '#eef0f4', 1, [2, 3]);
    if (k === 2){   // 합성파 뒤에 두 파동을 옅게 겹쳐 그린다
      [0, 1].forEach(i => { const pts = []; for (let q = 0; q <= pw; q += 2){ const x = q / pw * LX; pts.push([L + q, Y(disp(ws[i], x, t))]); } line(ctx, pts, i ? 'rgba(224,120,47,0.35)' : 'rgba(47,111,223,0.35)', 1.2); }); }
    const pts = []; for (let q = 0; q <= pw; q += 1.5){ const x = q / pw * LX; pts.push([L + q, Y(r.f(x))]); } line(ctx, pts, r.c, k === 2 ? 2.8 : 2);
    ctx.fillStyle = r.c; ctx.beginPath(); ctx.arc(X(px), Y(r.f(px)), k === 2 ? 5 : 4, 0, 7); ctx.fill();
    // 진행 방향
    const dirR = k === 0 || (k === 1 && mode === 'same'); if (k < 2) arrow(ctx, dirR ? L + pw - 46 : L + pw - 16, r.y - hh - 9, dirR ? L + pw - 16 : L + pw - 46, r.y - hh - 9, r.c, 2, 7);
  });
  $('d1').textContent = '오른쪽으로 진행'; $('d2').textContent = mode === 'same' ? '오른쪽으로 진행' : '왼쪽으로 진행';
  const y1 = disp(ws[0], px, t), y2 = disp(ws[1], px, t), cm = v => fmt(v, 2) + ' cm';
  setStats([['시간', fmt(t, 2) + ' s'], ['파동 1의 주기와 속력', fmt(1 / ws[0].f, 2) + ' s, ' + fmt(ws[0].v, 2) + ' m/s', BLUE], ['파동 2의 주기와 속력', fmt(1 / ws[1].f, 2) + ' s, ' + fmt(ws[1].v, 2) + ' m/s', ORANGE],
    ['P에서 파동 1의 변위', cm(y1), BLUE], ['P에서 파동 2의 변위', cm(y2), ORANGE], ['P에서 합성파의 변위', cm(y1 + y2), PURPLE]]);
}
function sync(){ const on = $('cSame').checked; if (on){ [['a1S', 'a2S'], ['f1S', 'f2S'], ['l1S', 'l2S']].forEach(p => { $(p[1]).value = $(p[0]).value; }); up(); }
  $('w2').style.opacity = on ? 0.45 : 1; ['a2S', 'f2S', 'l2S'].forEach(id => { $(id).disabled = on; }); }
const TEXT = {
  opp: ['두 파동이 줄의 양 끝에서 서로를 향해 진행합니다. 두 파동이 만나는 동안과 지나간 뒤의 모습을 관찰하세요. 시간 막대를 움직이거나 ‘시간’ 칸에 숫자를 직접 입력하면 원하는 시각의 모습을 볼 수 있습니다.',
    '두 파동이 만나 겹쳐질 때 매질의 변위는 각 파동의 변위를 더한 것과 같습니다(중첩 원리). 겹쳐진 뒤에는 두 파동이 서로 영향을 주지 않고 원래 모양 그대로 진행합니다(파동의 독립성). 마루와 마루가 만나면 변위가 커지고(보강 간섭), 마루와 골이 만나면 변위가 작아집니다(상쇄 간섭). 진폭, 진동수, 파장이 같은 두 연속 파동이 마주 보고 진행하면 진행하지 않는 것처럼 보이는 정상파가 만들어지며, 전혀 진동하지 않는 마디와 가장 크게 진동하는 배가 번갈아 나타납니다. 파동의 속력은 v = fλ이고, 같은 매질에서는 속력이 같으므로 진동수가 크면 파장이 짧습니다.'],
  same: ['두 파동이 줄의 왼쪽 끝에서 출발해 같은 방향으로 진행합니다. 파동 2가 늦게 출발하는 정도(위상 차)를 바꾸며 합성파의 진폭을 비교하고, 진동수를 조금 다르게도 해 보세요.',
    '같은 방향으로 진행하는 두 파동도 중첩 원리에 따라 변위가 더해집니다. 진동수와 파장이 같은 두 파동의 위상이 같으면(위상 차 0°) 합성파의 진폭은 두 진폭의 합이 되고, 위상이 반대이면(위상 차 180°) 두 진폭의 차가 됩니다. 진폭까지 같으면 완전히 상쇄되어 줄이 진동하지 않습니다. 소음 제거 헤드폰은 소음과 위상이 반대인 소리를 만들어 소음을 줄입니다. 속력은 같고 진동수가 조금 다른 두 파동을 합치면 진폭이 커졌다 작아졌다를 되풀이하며, 소리에서는 이것이 맥놀이로 들립니다.'] };
setupTabs(m => { mode = m; $('hintTxt').textContent = TEXT[m][0]; $('noteTxt').textContent = TEXT[m][1]; rs(); reset(); });
$('goB').addEventListener('click', () => { run = !run; $('goB').textContent = run ? '일시 정지' : '계속'; });
const showT = timeBar($('tbar'), { max: () => Math.max(30, Math.ceil(t / 10) * 10), set: setT, step: 0.5 });
$('resetB').addEventListener('click', reset);
$('cSame').addEventListener('change', sync);
['a1S', 'f1S', 'l1S'].forEach(id => $(id).addEventListener('input', () => { if ($('cSame').checked) sync(); }));
['f1S', 'l1S', 'f2S', 'l2S', 'phS', 'kindS'].forEach(id => $(id).addEventListener(id === 'kindS' ? 'change' : 'input', reset));
sync(); loop(draw);
})();
