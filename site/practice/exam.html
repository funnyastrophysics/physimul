<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>모의고사 만들기</title>
<style>
  :root{ --bg:#f4f6f9; --panel:#fff; --ink:#1d2330; --sub:#5b6475; --line:#d9dde4; --accent:#2f6fdf; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
  .wrap{max-width:900px;margin:0 auto;padding:16px 16px 40px}
  .back{display:inline-block;color:var(--accent);text-decoration:none;font-size:15px;padding:6px 0}
  h1{font-size:22px;margin:4px 0}
  .hint{color:var(--sub);font-size:14px;margin:0 0 14px;line-height:1.5}
  .subj{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .subj h2{font-size:18px;margin:0 0 10px;padding-left:10px;border-left:4px solid var(--accent)}
  .units{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
  .units button{font:inherit;font-size:15px;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;touch-action:manipulation;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .units button b{font-weight:700}
  .units button span{font-size:13px;color:var(--sub);white-space:nowrap}
  .units button.on{border-color:var(--accent);background:#e8eefb}
  .units button:disabled{opacity:.5;cursor:default}
  .msg{color:var(--sub);font-size:14px;margin:12px 0}
  @media (min-width:1100px){ .wrap{max-width:1400px} }   /* 넓은 화면에서는 문제를 2열로 */
  footer{color:var(--sub);font-size:12px;text-align:center;margin-top:20px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../#practice">← 처음으로</a>
  <h1>모의고사 만들기</h1>
  <p class="hint">문제 수(10·15·20문제)와 단원, 출처(평가원·교육청)를 고르면 기출문제를 무작위로 뽑아 한 회차 모의고사를 만들어요. 다 푼 뒤 채점하면 점수와 해설을 볼 수 있어요. 수업 코드가 필요해요.</p>
  <p class="msg" id="msg">문제 목록을 불러오는 중…</p>
  <section id="panel"></section>
  <footer>수업용 비영리 자료입니다.<br>© 2026 이정태. All Rights Reserved.</footer>
</div>
<script src="panel.js?v=202611264"></script>
<script>
(function(){
  var UNITS = {"p1": ["물리학", "힘과 에너지"], "p2": ["물리학", "전기와 자기"], "p3": ["물리학", "빛과 물질"], "m1": ["역학과 에너지", "시공간과 운동"], "m2": ["역학과 에너지", "열과 에너지"], "m3": ["역학과 에너지", "탄성파와 소리"], "e1": ["전자기와 양자", "전자기적 상호작용"], "e2": ["전자기와 양자", "빛과 정보 통신"], "e3": ["전자기와 양자", "양자와 미시세계"], "x": ["미분류", "미분류 문항"]}, CODES = {"12물리01-01": "평형과 돌림힘", "12물리01-02": "뉴턴 운동 법칙과 등가속도 운동", "12물리01-03": "작용 반작용과 운동량 보존", "12물리01-04": "일과 역학적 에너지 보존", "12물리01-05": "역학적 에너지와 열", "12물리01-06": "열효율과 영구 기관", "12물리02-01": "전기장과 전위차", "12물리02-02": "저항의 연결과 소비 전력", "12물리02-03": "축전기", "12물리02-04": "자성체", "12물리02-05": "전류의 자기 작용", "12물리02-06": "전자기 유도 기술", "12물리03-01": "빛의 간섭", "12물리03-02": "빛의 굴절과 볼록 렌즈의 상", "12물리03-03": "빛과 물질의 이중성", "12물리03-04": "에너지 준위와 스펙트럼", "12물리03-05": "에너지띠와 반도체", "12물리03-06": "특수 상대성 이론", "12역학01-01": "힘의 합력과 운동 예측", "12역학01-02": "포물선 운동과 역학적 에너지", "12역학01-03": "힘의 방향과 운동 방향 변화(원운동)", "12역학01-04": "케플러 법칙과 중력", "12역학01-05": "탈출 속도와 우주선 발사", "12역학01-06": "등가 원리와 블랙홀", "12역학02-01": "열전달과 단열", "12역학02-02": "상태 변화와 이상 기체", "12역학02-03": "열역학 제1법칙", "12역학02-04": "열기관과 열효율", "12역학02-05": "비가역 현상과 엔트로피", "12역학03-01": "단진동", "12역학03-02": "탄성파의 진행·반사·투과", "12역학03-03": "도플러 효과", "12역학03-04": "음파의 간섭", "12역학03-05": "정상파와 악기", "12전자01-01": "전기장과 전기력선·등전위면", "12전자01-02": "정전기 유도와 유전 분극", "12전자01-03": "전류에 의한 자기장", "12전자01-04": "로런츠 힘", "12전자01-05": "자기선속과 전자기 유도", "12전자01-06": "저항·축전기·인덕터", "12전자01-07": "반도체 소자 회로", "12전자02-01": "빛의 간섭과 회절", "12전자02-02": "렌즈와 거울, 광학 기기", "12전자02-03": "편광", "12전자02-04": "광전 효과", "12전자02-05": "레이저", "12전자03-01": "입자-파동 이중성", "12전자03-02": "중첩과 측정, 양자 기술", "12전자03-03": "터널 효과", "12전자03-04": "현대의 원자 모형", "12전자03-05": "핵융합과 별의 스펙트럼", "미분류": "미분류"};
  var msg = document.getElementById('msg');
  if (!window.PQ) { msg.textContent = location.protocol.indexOf('http') === 0 ? '이 브라우저에서는 문제를 열 수 없습니다. 크롬이나 사파리에서 열어 주세요.' : '이 화면은 사이트 주소로 열었을 때만 동작합니다.'; return; }
  PQ.ready('data/').then(function (d) {
    if (!d || !d.units) { msg.textContent = '아직 준비된 문제가 없습니다.'; return; }
    msg.style.display = 'none';
    PQ.exam(document.getElementById('panel'), { base: 'data/', units: UNITS, counts: d.units, codes: CODES });
  }).catch(function () { msg.textContent = '문제 목록을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로 고침해 주세요.'; });
})();
</script>
</body>
</html>
