# site 폴더를 GitHub Pages에 공개합니다. main 브랜치에 올릴 때마다 자동으로 실행됩니다.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ① site 폴더를 묶어 올린다
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  # ② 묶음이 다 올라간 뒤 따로 공개한다 (한 단계에서 하면 묶음을 못 찾는 일이 있었음, 2026-11)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
